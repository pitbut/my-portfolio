services:
  - type: web
    name: istok
    env: python
    rootDir: projects/istok
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && python seed.py && gunicorn run:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_CONFIG
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ITEMS_PER_PAGE
        value: "9"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FORCE_RESEED
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: IMGBB_API_KEY
        sync: false

  - type: web
    name: b2b-platform-uz
    env: python
    rootDir: projects/b2b-platform
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && python seed.py && gunicorn run:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_CONFIG
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: b2b-platform-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: IMGBB_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: b2b-platform-db
    plan: free
    region: frankfurt
