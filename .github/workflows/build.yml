name: Build Zamri APK

on:
  push:
    branches: [ main ]
    tags: [ 'zamri-v*' ]
    paths:
      - 'projects/zamri/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/zamri

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" --sdk_root="$ANDROID_HOME"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble release APK (debug-signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zamri-release-apk
          path: projects/zamri/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        if: startsWith(github.ref, 'refs/tags/zamri-v')
        uses: softprops/action-gh-release@v2
        with:
          files: projects/zamri/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
