name: Build Screen Translator APK

on:
  push:
    paths:
      - 'android/screen-translator/**'
      - '.github/workflows/build-screen-translator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/screen-translator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ScreenTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-apk
          path: android/screen-translator/ScreenTranslator.apk

      - name: Publish release "screen-translator-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screen-translator-latest
          name: Экранный переводчик (последняя сборка)
          body: |
            Android-приложение, которое автоматически переводит текст на экране любого приложения,
            включая Telegram с запретом копирования. Скачайте ScreenTranslator.apk на телефон и установите.
            Сборка: ${{ github.sha }} (ветка ${{ github.ref_name }})
          files: android/screen-translator/ScreenTranslator.apk
          make_latest: false
