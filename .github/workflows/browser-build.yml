name: Build PitBrowser

# Собирает браузер projects/browser: Windows, macOS, Linux (Electron) и Android (APK).
# Запуск вручную — файлы в артефактах; тег browser-v* — ещё и GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ['browser-v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/browser/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/browser/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: pitbrowser-${{ runner.os }}
          path: |
            projects/browser/desktop/dist/*.exe
            projects/browser/desktop/dist/*.dmg
            projects/browser/desktop/dist/*.AppImage
            projects/browser/desktop/dist/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/browser/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # ключ для публикации из GitHub Secrets (если не задан — сборка подписывается открытым тестовым ключом)
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.PIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PIT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - env:
          PIT_KEYSTORE_PASSWORD: ${{ secrets.PIT_KEYSTORE_PASSWORD }}
          PIT_KEY_ALIAS: ${{ secrets.PIT_KEY_ALIAS }}
          PIT_KEY_PASSWORD: ${{ secrets.PIT_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Collect APK and demo .pitapp
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/PitBrowser-android.apk
          cp app/build/generated/pitAssets/preinstalled/*.pitapp out/
      - uses: actions/upload-artifact@v4
        with:
          name: pitbrowser-Android
          path: projects/browser/android/out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/browser-v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: PitBrowser ${{ github.ref_name }}
          body: |
            **Windows:** `PitBrowser Setup *.exe` (установщик) или `PitBrowser *.exe` (portable)
            **macOS:** `.dmg` — при первом запуске правый клик → «Открыть»
            **Linux:** `.AppImage` или `.deb`
            **Android:** `PitBrowser-android.apk`
            **Демо-игра:** `tilt-coins.pitapp` (уже встроена в APK)
          files: out/*
