{% extends "base.html" %}
{% block title %}Вход — ИИ-репетитор{% endblock %}
{% block content %}
<div class="wrap">
  <h1 style="text-align:center; margin-top:30px;">Вход</h1>
  <form class="form-card card" method="post">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn">Войти</button>
    <p class="form-note">Ещё нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a></p>
  </form>
</div>
{% endblock %}
