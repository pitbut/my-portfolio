{% extends "base.html" %}
{% block title %}Регистрация — ИИ-репетитор{% endblock %}
{% block content %}
<div class="wrap">
  <h1 style="text-align:center; margin-top:30px;">Регистрация ученика</h1>
  <form class="form-card card" method="post">
    <div class="field">
      <label for="name">Имя</label>
      <input type="text" id="name" name="name" value="{{ name }}" required autofocus>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" required>
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" minlength="8" required>
    </div>
    <div class="field">
      <label for="password2">Повторите пароль</label>
      <input type="password" id="password2" name="password2" minlength="8" required>
    </div>
    <button type="submit" class="btn">Зарегистрироваться</button>
    <p class="form-note">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
  </form>
</div>
{% endblock %}
