<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#182617;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#2c4324;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6ea83a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wheat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d35e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a544;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="620" cy="140" r="70" fill="#f4d35e" opacity="0.25"/>

  <text x="400" y="90" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#f4d35e" text-anchor="middle">
    🌾 Агро-калькулятор
  </text>
  <text x="400" y="126" font-family="Arial, sans-serif" font-size="19" fill="#eef5e6" text-anchor="middle" opacity="0.9">
    Корм для животных · посев и удобрения
  </text>

  <!-- поле с колосьями -->
  <g transform="translate(80, 430)">
    <rect x="-20" y="0" width="680" height="90" fill="#2c4324" opacity="0.6" rx="6"/>
    <g stroke="url(#wheat)" stroke-width="3" fill="none">
      <path d="M20 90 L20 20"/>
      <path d="M80 90 L80 10"/>
      <path d="M140 90 L140 25"/>
      <path d="M600 90 L600 15"/>
      <path d="M660 90 L660 22"/>
    </g>
    <g fill="url(#wheat)">
      <ellipse cx="20" cy="18" rx="7" ry="14"/>
      <ellipse cx="80" cy="8" rx="7" ry="14"/>
      <ellipse cx="140" cy="23" rx="7" ry="14"/>
      <ellipse cx="600" cy="13" rx="7" ry="14"/>
      <ellipse cx="660" cy="20" rx="7" ry="14"/>
    </g>
  </g>

  <!-- корова (упрощённо) -->
  <g transform="translate(230, 300)">
    <ellipse cx="0" cy="30" rx="90" ry="55" fill="#eef5e6"/>
    <circle cx="-95" cy="10" r="38" fill="#eef5e6"/>
    <circle cx="-110" cy="-2" r="6" fill="#182617"/>
    <ellipse cx="-70" cy="-2" rx="10" ry="16" fill="#2c4324" opacity="0.5"/>
    <ellipse cx="20" cy="20" rx="18" ry="12" fill="#2c4324" opacity="0.35"/>
    <ellipse cx="-30" cy="60" rx="14" ry="10" fill="#2c4324" opacity="0.35"/>
    <rect x="-70" y="75" width="14" height="30" fill="#eef5e6"/>
    <rect x="60" y="75" width="14" height="30" fill="#eef5e6"/>
  </g>

  <!-- чат-подсказка "прямой/обратный расчёт" -->
  <g transform="translate(430, 300)">
    <rect x="-10" y="-70" width="330" height="150" rx="20" fill="#ffffff" opacity="0.95"/>
    <text x="10" y="-25" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2c4324">Прямой: поголовье → корм</text>
    <text x="10" y="8" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2c4324">Обратный: результат → нужно</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="14" fill="#6ea83a">По нормам · с отчётом .docx</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#182617">
    <rect x="60" y="555" width="110" height="30" rx="15" fill="url(#wheat)"/>
    <text x="115" y="575" text-anchor="middle">Корма</text>
    <rect x="190" y="555" width="110" height="30" rx="15" fill="url(#wheat)"/>
    <text x="245" y="575" text-anchor="middle">Посев</text>
    <rect x="320" y="555" width="150" height="30" rx="15" fill="url(#wheat)"/>
    <text x="395" y="575" text-anchor="middle">Экономика</text>
    <rect x="490" y="555" width="130" height="30" rx="15" fill="url(#wheat)"/>
    <text x="555" y="575" text-anchor="middle">Flask</text>
  </g>
</svg>
