plugins {
    id 'com.android.application'
}

// Подпись релиза: создайте файл keystore.properties рядом с этим проектом (не коммитьте его!)
//   storeFile=/путь/к/geroi-igr.jks
//   storePassword=...
//   keyAlias=geroi
//   keyPassword=...
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.robutpit.geroiigr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.robutpit.geroiigr'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    // Игра (HTML + Three.js) берётся прямо из папки ../game
    sourceSets {
        main.assets.srcDirs += ['../../game']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
