{% extends "base.html" %}
{% block title %}Восстановление пароля — Grand Dice Casino{% endblock %}
{% block content %}
<div class="panel" style="max-width: 420px; margin: 0 auto;">
  <h1>Восстановление пароля</h1>
  <p style="color: #ccc; margin-bottom: 20px;">Введите email, указанный при регистрации — пришлём ссылку для смены пароля.</p>
  <form method="post">
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <button type="submit" class="btn" style="width: 100%;">Отправить ссылку</button>
  </form>
  <p style="margin-top: 16px;"><a href="{{ url_for('auth.login') }}">← Назад ко входу</a></p>
</div>
{% endblock %}
