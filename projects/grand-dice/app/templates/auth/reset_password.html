{% extends "base.html" %}
{% block title %}Новый пароль — Grand Dice Casino{% endblock %}
{% block content %}
<div class="panel" style="max-width: 420px; margin: 0 auto;">
  <h1>Новый пароль</h1>
  <form method="post">
    <div class="form-row">
      <label for="password">Новый пароль (от 8 символов)</label>
      <input type="password" id="password" name="password" minlength="8" required autofocus>
    </div>
    <div class="form-row">
      <label for="password2">Повторите пароль</label>
      <input type="password" id="password2" name="password2" minlength="8" required>
    </div>
    <button type="submit" class="btn" style="width: 100%;">Сохранить пароль</button>
  </form>
</div>
{% endblock %}
