{% extends "base.html" %}
{% block title %}{{ _('Регистрация') }} — Grand Dice Casino{% endblock %}
{% block content %}
<div class="panel" style="max-width: 420px; margin: 0 auto;">
  <h1>{{ _('Регистрация') }}</h1>
  <form method="post">
    <div class="form-row">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" required>
    </div>
    <div class="form-row">
      <label for="password">{{ _('Пароль (от 8 символов)') }}</label>
      <input type="password" id="password" name="password" minlength="8" required>
    </div>
    <div class="form-row">
      <label for="password2">{{ _('Повторите пароль') }}</label>
      <input type="password" id="password2" name="password2" minlength="8" required>
    </div>
    <button type="submit" class="btn" style="width: 100%;">{{ _('Создать аккаунт') }}</button>
  </form>
  <p style="margin-top: 16px; color: #ccc;">{{ _('Уже есть аккаунт?') }} <a href="{{ url_for('auth.login') }}">{{ _('Войти') }}</a></p>
</div>
{% endblock %}
