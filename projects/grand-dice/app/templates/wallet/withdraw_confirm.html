{% extends "base.html" %}
{% block title %}Подтверждение вывода — Grand Dice Casino{% endblock %}
{% block content %}
<div class="panel" style="max-width: 420px; margin: 0 auto;">
  <h1>Подтвердите вывод</h1>
  <p style="color: #ccc; margin-bottom: 20px;">
    Мы отправили 6-значный код на {{ current_user.email }} для подтверждения
    вывода <strong style="color: var(--gold);">{{ req.amount }}</strong>.
  </p>
  <form method="post">
    <div class="form-row">
      <label for="code">Код из письма</label>
      <input type="text" id="code" name="code" maxlength="6" pattern="[0-9]{6}" required autofocus>
    </div>
    <button type="submit" class="btn" style="width: 100%;">Подтвердить вывод</button>
  </form>
  <p style="margin-top: 16px;"><a href="{{ url_for('wallet.index') }}">← Назад в кошелёк</a></p>
</div>
{% endblock %}
