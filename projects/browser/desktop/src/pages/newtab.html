<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Новая вкладка</title><link rel="stylesheet" href="common.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  .logo { margin-top: 14vh; font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  .logo span { color: var(--accent); }
  form { width: min(620px, 92vw); margin: 26px 0 36px; }
  #q { width: 100%; height: 50px; border-radius: 25px; padding: 0 22px; font-size: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 112px); gap: 10px; justify-content: center; width: min(760px, 94vw); }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 14px; text-decoration: none; cursor: pointer; position: relative; }
  .tile:hover { background: var(--hover); }
  .tile .ic { width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  .tile .ic img { width: 24px; height: 24px; }
  .tile .n { font-size: 12px; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .engine { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style></head>
<body>
  <div class="logo">Pit<span>Browser</span></div>
  <form id="f"><input id="q" type="search" placeholder="Поиск или адрес сайта" autofocus autocomplete="off"><div class="engine" id="engine"></div></form>
  <div class="grid" id="grid"></div>
<script>
const DEFAULT_TILES = [
  { title: 'YouTube', url: 'https://www.youtube.com/' },
  { title: 'Wikipedia', url: 'https://ru.wikipedia.org/' },
  { title: 'GitHub', url: 'https://github.com/' },
  { title: 'Telegram', url: 'https://web.telegram.org/' },
  { title: 'Портфолио', url: 'https://www.robutpit.com/' },
];
const favicon = (u) => { try { return new URL(u).origin + '/favicon.ico'; } catch { return ''; } };
document.getElementById('f').onsubmit = (e) => { e.preventDefault(); const v = q.value.trim(); if (v) pit.open(v); };
(async () => {
  const s = await pit.settings();
  document.getElementById('engine').textContent = 'Поиск: ' + (s.engines[s.searchEngine]?.name || 'Google');
  const bm = await pit.bookmarks();
  const tiles = bm.length ? bm.slice(-16) : DEFAULT_TILES;
  for (const t of tiles) {
    const a = document.createElement('a');
    a.className = 'tile'; a.href = t.url; a.title = t.url;
    const ic = document.createElement('div'); ic.className = 'ic';
    const img = document.createElement('img'); img.src = t.favicon || favicon(t.url);
    img.onerror = () => { img.remove(); ic.textContent = (t.title || '?')[0].toUpperCase(); };
    ic.append(img);
    const n = document.createElement('div'); n.className = 'n'; n.textContent = t.title;
    a.append(ic, n);
    document.getElementById('grid').append(a);
  }
})();
</script></body></html>
