<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая вкладка</title>
<style>
  :root { --bg: #f4f6f9; --card: #fff; --text: #1f2328; --muted: #646b75; --line: #dde1e7; --accent: #e0a100; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1f24; --card: #2a2c32; --text: #e8eaed; --muted: #9aa0a6; --line: #3a3d44; --accent: #ffc531; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 0 16px; }
  .logo { margin-top: 12vh; font-size: 36px; font-weight: 800; letter-spacing: -1px; }
  .logo span { color: var(--accent); }
  form { width: 100%; max-width: 560px; margin: 22px 0 28px; }
  input { width: 100%; height: 50px; border-radius: 25px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 0 20px; font-size: 16px; outline: 0; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  input:focus { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 560px; }
  a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px; border-radius: 14px; text-decoration: none; color: inherit; }
  a:active { background: rgba(127,127,127,.15); }
  .ic { width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 18px; overflow: hidden; }
  .ic img { width: 24px; height: 24px; }
  .n { font-size: 12px; max-width: 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .engine { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
  h2 { width: 100%; max-width: 560px; font-size: 13px; font-weight: 600; color: var(--muted); margin: 8px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  h2 button { font: inherit; color: var(--accent); background: none; border: 0; padding: 4px 0; }
  .apps { margin-bottom: 18px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px; border-radius: 14px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .app:active { background: rgba(127,127,127,.15); }
  .app .ic { width: 58px; height: 58px; border-radius: 16px; background: linear-gradient(135deg, #ffd54a, #e08a00); border: 0; color: #222; font-size: 24px; }
  .app .ic img { width: 58px; height: 58px; }
  .app.store .ic { background: linear-gradient(135deg, #5b8cff, #7a4dff); font-size: 28px; }
  .hint { color: var(--muted); font-size: 12px; max-width: 560px; width: 100%; margin: -8px 0 14px; }
</style></head>
<body>
  <div class="logo">Pit<span>Browser</span></div>
  <form id="f"><input id="q" type="search" placeholder="Поиск или адрес сайта" autocomplete="off" enterkeyhint="go"><div class="engine" id="engine"></div></form>
  <h2 id="appsTitle" hidden>Приложения и игры <button id="installFile" type="button">+ Из файла</button></h2>
  <div class="grid apps" id="apps"></div>
  <div class="hint" id="appsHint" hidden>Нажмите — открыть, удерживайте — рекорды, ярлык, удаление.</div>
  <h2>Сайты</h2>
  <div class="grid" id="grid"></div>
<script>
document.getElementById('f').onsubmit = function (e) {
  e.preventDefault();
  var v = document.getElementById('q').value.trim();
  if (v) location.href = 'pitbrowser://open?q=' + encodeURIComponent(v);
};
document.getElementById('installFile').onclick = function () { location.href = 'pitbrowser://install-file'; };

// Вызывается приложением после загрузки: render({engine, tiles: [{title, url}], apps: [{id, name, icon}]})
function render(data) {
  renderApps(data.apps || [], data.store);
  document.getElementById('engine').textContent = 'Поиск: ' + data.engine;
  var grid = document.getElementById('grid');
  grid.textContent = '';
  data.tiles.forEach(function (t) {
    var a = document.createElement('a'); a.href = t.url;
    var ic = document.createElement('div'); ic.className = 'ic';
    var img = document.createElement('img');
    try { img.src = new URL(t.url).origin + '/favicon.ico'; } catch (e) {}
    img.onerror = function () { img.remove(); ic.textContent = (t.title || '?').charAt(0).toUpperCase(); };
    ic.appendChild(img);
    var n = document.createElement('div'); n.className = 'n'; n.textContent = t.title;
    a.appendChild(ic); a.appendChild(n);
    grid.appendChild(a);
  });
}

function renderApps(apps, storeUrl) {
  var box = document.getElementById('apps');
  box.textContent = '';
  // первая плитка — магазин игр
  if (storeUrl) {
    var st = document.createElement('div'); st.className = 'app store';
    st.innerHTML = '<div class="ic">🛍️</div><div class="n">Магазин игр</div>';
    st.addEventListener('click', function () { location.href = storeUrl; });
    box.appendChild(st);
  }
  document.getElementById('appsTitle').hidden = false;
  document.getElementById('appsHint').hidden = !apps.length;
  apps.forEach(function (a) {
    var el = document.createElement('div'); el.className = 'app';
    var ic = document.createElement('div'); ic.className = 'ic';
    if (a.icon) { var img = document.createElement('img'); img.src = a.icon; ic.appendChild(img); }
    else ic.textContent = (a.name || '?').charAt(0).toUpperCase();
    var n = document.createElement('div'); n.className = 'n'; n.textContent = a.name;
    el.appendChild(ic); el.appendChild(n);
    // короткое нажатие — запуск, долгое — меню приложения
    var timer = null, longPressed = false;
    el.addEventListener('touchstart', function () {
      longPressed = false;
      timer = setTimeout(function () { longPressed = true; location.href = 'pitbrowser://app?id=' + encodeURIComponent(a.id); }, 550);
    }, { passive: true });
    ['touchend', 'touchmove', 'touchcancel'].forEach(function (t) { el.addEventListener(t, function () { clearTimeout(timer); }, { passive: true }); });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    el.addEventListener('click', function () {
      if (!longPressed) location.href = 'pitbrowser://launch?id=' + encodeURIComponent(a.id);
    });
    box.appendChild(el);
  });
}
</script></body></html>
