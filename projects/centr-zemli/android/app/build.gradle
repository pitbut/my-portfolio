plugins {
    id 'com.android.application'
}

// Подпись релиза: android/keystore.properties (в git не попадает)
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.robutpit.centrzemli'
    compileSdk 35

    defaultConfig {
        applicationId 'com.robutpit.centrzemli'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir('generated/www-assets')
    }
}

// Игра — это веб-версия из projects/centr-zemli: копируем её в assets/www
def copyWebGame = tasks.register('copyWebGame', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'game.js', 'style.css', 'icon.png'
    }
    into layout.buildDirectory.dir('generated/www-assets/www')
}
tasks.named('preBuild') { dependsOn copyWebGame }
