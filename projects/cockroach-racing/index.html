<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Тараканьи бега — прототип</title>
<style>
  :root{
    --bg-0:#14120f;
    --bg-1:#1d1a15;
    --bg-2:#26221b;
    --card:#2b261e;
    --card-hi:#332d23;
    --amber:#e0a458;
    --amber-dark:#a97a3c;
    --green:#7c9473;
    --red:#c25b4a;
    --text:#f1ead9;
    --text-dim:#b3a892;
    --line:#3d362a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, #3a2f1e 0%, transparent 55%),
      radial-gradient(circle at 100% 10%, #24301f 0%, transparent 45%),
      var(--bg-0);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:40px;
  }
  a{color:inherit;}
  #app{max-width:720px;margin:0 auto;padding:16px 16px 60px;}

  header.top{
    text-align:center;
    padding:22px 12px 10px;
  }
  header.top h1{
    font-size:1.5rem;
    margin:0 0 4px;
    letter-spacing:.5px;
  }
  header.top p{
    margin:0;
    color:var(--text-dim);
    font-size:.88rem;
  }
  .back-home{
    display:inline-block;
    margin-bottom:10px;
    font-size:.8rem;
    color:var(--text-dim);
    text-decoration:none;
    border:1px solid var(--line);
    padding:4px 10px;
    border-radius:20px;
  }
  .back-home:hover{color:var(--amber);border-color:var(--amber-dark);}

  nav.steps{
    display:flex;
    gap:6px;
    justify-content:center;
    flex-wrap:wrap;
    margin:14px 0 20px;
  }
  nav.steps button{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:6px 12px;
    border-radius:20px;
    font-size:.78rem;
    cursor:pointer;
  }
  nav.steps button.active{
    background:linear-gradient(135deg,var(--amber),var(--amber-dark));
    color:#241a0c;
    border-color:transparent;
    font-weight:600;
  }
  nav.steps button:disabled{opacity:.35;cursor:not-allowed;}

  .roach-badge{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:16px;
  }
  .roach-badge svg{flex:0 0 auto;}
  .roach-badge .info{flex:1;}
  .roach-badge .name{font-weight:600;}
  .roach-badge .stats{font-size:.75rem;color:var(--text-dim);margin-top:2px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{margin:0 0 4px;font-size:1.05rem;}
  .card p.desc{margin:0 0 12px;color:var(--text-dim);font-size:.85rem;}

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  @media (max-width:420px){.grid{grid-template-columns:1fr;}}

  .pick{
    background:var(--bg-2);
    border:2px solid var(--line);
    border-radius:14px;
    padding:12px;
    cursor:pointer;
    text-align:center;
    transition:border-color .15s, transform .15s;
  }
  .pick:hover{border-color:var(--amber-dark);}
  .pick.selected{border-color:var(--amber);background:var(--card-hi);}
  .pick .pname{font-weight:600;font-size:.9rem;margin-top:6px;}
  .pick .pdesc{font-size:.72rem;color:var(--text-dim);margin-top:3px;line-height:1.3;}
  .pick .pmini{font-size:.68rem;color:var(--amber);margin-top:4px;}

  .swatches{display:flex;flex-wrap:wrap;gap:8px;}
  .swatch{
    width:36px;height:36px;border-radius:50%;
    border:3px solid transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .swatch.selected{border-color:var(--amber);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:linear-gradient(135deg,var(--amber),var(--amber-dark));
    color:#241a0c;border:none;border-radius:12px;
    padding:11px 18px;font-size:.92rem;font-weight:600;
    cursor:pointer;
  }
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.secondary{
    background:var(--bg-2);color:var(--text);border:1px solid var(--line);
    font-weight:500;
  }
  .btn.green{background:linear-gradient(135deg,#9db98d,var(--green));color:#132313;}
  .btn.wide{width:100%;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}

  .stat-row{margin-bottom:10px;}
  .stat-row .label{
    display:flex;justify-content:space-between;
    font-size:.78rem;color:var(--text-dim);margin-bottom:4px;
  }
  .bar{
    height:9px;border-radius:6px;background:var(--bg-2);
    overflow:hidden;border:1px solid var(--line);
  }
  .bar > i{display:block;height:100%;border-radius:6px;}
  .bar.speed > i{background:linear-gradient(90deg,#e0a458,#c9803c);}
  .bar.stamina > i{background:linear-gradient(90deg,#9db98d,#6f8a63);}
  .bar.stress > i{background:linear-gradient(90deg,#8fb3c9,#4f7387);}
  .bar.satiety > i{background:linear-gradient(90deg,#d98a6f,#b5541e);}

  .track-pick{
    background:var(--bg-2);border:2px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;cursor:pointer;
  }
  .track-pick.selected{border-color:var(--amber);background:var(--card-hi);}
  .track-pick .tname{font-weight:600;font-size:.95rem;}
  .track-pick .tdesc{font-size:.78rem;color:var(--text-dim);margin-top:3px;}
  .track-pick .ttags{margin-top:6px;font-size:.68rem;color:var(--amber);}

  #race-canvas-wrap{
    position:relative;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);background:#20241c;
  }
  canvas{display:block;width:100%;height:auto;}

  .sensor-panel{
    display:flex;flex-direction:column;gap:10px;margin-top:14px;
  }
  .sensor-btn{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-2);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;
  }
  .sensor-btn .meter{
    flex:1;height:8px;margin:0 10px;border-radius:6px;background:var(--bg-1);
    overflow:hidden;border:1px solid var(--line);
  }
  .sensor-btn .meter > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--red));}
  .sensor-btn .status{font-size:.72rem;color:var(--text-dim);min-width:70px;text-align:right;}
  .sensor-btn label{font-size:.82rem;flex:0 0 150px;}

  .hardcore-toggle{
    display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--text-dim);margin-top:4px;
  }

  #race-log{
    margin-top:12px;max-height:120px;overflow-y:auto;
    font-size:.76rem;color:var(--text-dim);
    background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
  }
  #race-log div{padding:2px 0;border-bottom:1px dashed var(--line);}
  #race-log div:last-child{border-bottom:none;}

  .results-list{list-style:none;margin:0;padding:0;}
  .results-list li{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-2);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;margin-bottom:8px;
  }
  .results-list li .place{
    width:26px;height:26px;border-radius:50%;background:var(--bg-1);
    display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;
    border:1px solid var(--line);
  }
  .results-list li.you{border-color:var(--amber);}
  .results-list li .rname{flex:1;font-size:.88rem;}
  .results-list li .rtime{font-size:.76rem;color:var(--text-dim);}

  .note{
    font-size:.74rem;color:var(--text-dim);line-height:1.5;
    background:var(--bg-2);border:1px dashed var(--line);border-radius:10px;
    padding:10px 12px;margin-top:16px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

const STORAGE_KEY = "roach-racing-save-v1";

const BREEDS = {
  prusak:      { name:"Прусак",              desc:"Мелкий и шустрый, но нервный", size:15, baseSpeed:1.18, baseStamina:0.78, baseStress:0.72 },
  black:       { name:"Чёрный таракан",       desc:"Универсал, хорошо обучается",  size:19, baseSpeed:1.00, baseStamina:1.00, baseStress:1.00 },
  madagascar:  { name:"Мадагаскарский шипящий", desc:"Крупный танк, почти не устаёт", size:26, baseSpeed:0.84, baseStamina:1.35, baseStress:1.32 },
  albino:      { name:"Альбинос",             desc:"Редкий, сбалансированный",     size:18, baseSpeed:1.06, baseStamina:0.95, baseStress:1.08 },
};

const COLORS = [
  {id:"rust",    name:"Ржавый",           hex:"#b5541e"},
  {id:"dark",    name:"Тёмный шоколад",   hex:"#3b2a20"},
  {id:"sand",    name:"Песочный",         hex:"#c9a869"},
  {id:"pale",    name:"Бледный альбинос", hex:"#e8dcc8"},
  {id:"crimson", name:"Багровый",         hex:"#8c2f2f"},
  {id:"olive",   name:"Оливковый",        hex:"#5c6b3a"},
];

const TRACKS = {
  table:    { name:"Стол переговоров",     desc:"Нейтральная трасса, чуть скользкая от полироли", distance:1000, friction:1.00, obstacles:[] , tags:["Баланс"]},
  kitchen:  { name:"Кухня",                desc:"Крошки и пятна кофе — сложнее держать курс",      distance:1000, friction:1.35, obstacles:[{pos:0.5,slow:0.35}], tags:["Стрессоустойчивость","Контроль"]},
  corridor: { name:"Коридор с преградами", desc:"Степлер, скрепки и чашка на пути",                distance:1050, friction:1.05, obstacles:[{pos:0.22,slow:0.5},{pos:0.5,slow:0.5},{pos:0.78,slow:0.5}], tags:["Скорость","Манёвр"]},
  gym:      { name:"Переговорка (марафон)",desc:"Длинная дистанция — экзамен на выносливость",     distance:1700, friction:1.00, obstacles:[{pos:0.6,slow:0.3}], tags:["Выносливость"]},
};

function defaultSave(){
  return {
    roach:null,
    color:COLORS[0].id,
    levels:{speed:0,stamina:0,stress:0},
    satiety:70,
    track:null,
    wins:0,
    races:0,
  };
}

function loadSave(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultSave();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultSave(), parsed);
  }catch(e){ return defaultSave(); }
}

function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(save)); }catch(e){}
}

let save = loadSave();
let screen = save.roach ? "train" : "select";
let raceEngine = null;

const app = document.getElementById("app");

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmtTime(s){return s.toFixed(2)+" с";}

function levelBonus(level){ return 1 + level*0.05; }

function roachSvg(breedKey, colorHex, size, opts){
  opts = opts || {};
  const s = size || 20;
  const wobble = opts.wobble || 0;
  const legAngle = (opts.legPhase||0);
  return `
  <svg width="${s*1.9}" height="${s*1.5}" viewBox="-30 -24 60 48" style="transform:rotate(${wobble*10}deg)">
    <ellipse cx="0" cy="0" rx="${s}" ry="${s*0.62}" fill="${colorHex}" stroke="#1a140d" stroke-width="1.4"/>
    <ellipse cx="${-s*0.55}" cy="0" rx="${s*0.42}" ry="${s*0.4}" fill="${colorHex}" stroke="#1a140d" stroke-width="1.2"/>
    <line x1="${-s*0.85}" y1="${-s*0.25}" x2="${-s*1.5}" y2="${-s*0.9+Math.sin(legAngle)*3}" stroke="#1a140d" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="${-s*0.85}" y1="${s*0.25}" x2="${-s*1.5}" y2="${s*0.9-Math.sin(legAngle)*3}" stroke="#1a140d" stroke-width="1.6" stroke-linecap="round"/>
    ${[-0.15,0.25,0.6].map((lx,i)=>`
      <line x1="${lx*s}" y1="${-s*0.5}" x2="${lx*s - 6}" y2="${-s*1.05 - (i%2? Math.sin(legAngle+i):Math.cos(legAngle+i))*3}" stroke="#1a140d" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="${lx*s}" y1="${s*0.5}" x2="${lx*s - 6}" y2="${s*1.05 + (i%2? Math.sin(legAngle+i):Math.cos(legAngle+i))*3}" stroke="#1a140d" stroke-width="1.4" stroke-linecap="round"/>
    `).join("")}
  </svg>`;
}

function render(){
  let html = "";
  html += `<header class="top">
    <a class="back-home" href="../../index.html">← в портфолио</a>
    <h1>🪳 Тараканьи бега</h1>
    <p>Прототип механик: питомец, тренировка, трассы, звук и вибрация</p>
  </header>`;
  html += renderNav();
  if(save.roach) html += renderRoachBadge();

  if(screen === "select") html += renderSelect();
  else if(screen === "train") html += renderTrain();
  else if(screen === "track") html += renderTrackPick();
  else if(screen === "race") html += renderRace();
  else if(screen === "results") html += renderResults();

  html += `<p class="note">Это браузерный прототип игровых механик. Реальный турнирный режим по Bluetooth
    (несколько телефонов рядом или экраны, сложенные в одно поле) требует нативного мобильного приложения —
    здесь показана логика тренировки, «живого» бега и реакции на шум/тряску, которую туда можно перенести.</p>`;

  app.innerHTML = html;
  attachHandlers();
}

function renderNav(){
  const steps = [
    ["select","1. Таракан"],
    ["train","2. Тренировка"],
    ["track","3. Трасса"],
    ["race","4. Гонка"],
    ["results","5. Результат"],
  ];
  return `<nav class="steps">${steps.map(([key,label])=>{
    const enabled = key==="select" ? true :
      key==="train" ? !!save.roach :
      key==="track" ? !!save.roach :
      key==="race" ? (!!save.roach && !!save.track) :
      key==="results" ? (!!raceEngine && raceEngine.done) : true;
    const active = screen===key ? "active" : "";
    return `<button data-nav="${key}" class="${active}" ${enabled?"":"disabled"}>${label}</button>`;
  }).join("")}</nav>`;
}

function renderRoachBadge(){
  const b = BREEDS[save.roach];
  const color = COLORS.find(c=>c.id===save.color).hex;
  return `<div class="roach-badge">
    ${roachSvg(save.roach,color,22,{})}
    <div class="info">
      <div class="name">${b.name}</div>
      <div class="stats">Скорость ${save.levels.speed} · Выносливость ${save.levels.stamina} · Стрессоустойчивость ${save.levels.stress} · Сытость ${save.satiety}%</div>
    </div>
  </div>`;
}

function renderSelect(){
  let html = `<div class="card"><h2>Выбери породу</h2><p class="desc">Порода определяет базовые характеристики. Тренировка меняет их дальше.</p>
  <div class="grid">`;
  for(const key in BREEDS){
    const b = BREEDS[key];
    const sel = save.roach===key ? "selected":"";
    html += `<div class="pick ${sel}" data-breed="${key}">
      ${roachSvg(key, COLORS.find(c=>c.id===save.color).hex, 20,{})}
      <div class="pname">${b.name}</div>
      <div class="pdesc">${b.desc}</div>
      <div class="pmini">Скор ${b.baseSpeed.toFixed(2)} · Вын ${b.baseStamina.toFixed(2)} · Стресс ${b.baseStress.toFixed(2)}</div>
    </div>`;
  }
  html += `</div></div>`;

  html += `<div class="card"><h2>Окрас (косметика)</h2><p class="desc">Не влияет на характеристики — только на вид.</p>
  <div class="swatches">`;
  for(const c of COLORS){
    const sel = save.color===c.id ? "selected":"";
    html += `<div class="swatch ${sel}" data-color="${c.id}" style="background:${c.hex}" title="${c.name}"></div>`;
  }
  html += `</div></div>`;

  html += `<button class="btn wide" data-action="confirm-select" ${save.roach?"":"disabled"}>Дальше → тренировка</button>`;
  return html;
}

function renderTrain(){
  const speedPct = save.levels.speed*10;
  const staminaPct = save.levels.stamina*10;
  const stressPct = save.levels.stress*10;
  return `<div class="card">
    <h2>Тренировка</h2>
    <p class="desc">Кормление поднимает выносливость и восполняет сытость. Тренировка поднимает скорость и понемногу — стрессоустойчивость,
    но тратит сытость (нужно ≥ 20%).</p>

    <div class="stat-row"><div class="label"><span>Сытость</span><span>${save.satiety}%</span></div>
      <div class="bar satiety"><i style="width:${save.satiety}%"></i></div></div>

    <div class="stat-row"><div class="label"><span>Скорость</span><span>${save.levels.speed}/10</span></div>
      <div class="bar speed"><i style="width:${speedPct}%"></i></div></div>

    <div class="stat-row"><div class="label"><span>Выносливость</span><span>${save.levels.stamina}/10</span></div>
      <div class="bar stamina"><i style="width:${staminaPct}%"></i></div></div>

    <div class="stat-row"><div class="label"><span>Стрессоустойчивость</span><span>${save.levels.stress}/10</span></div>
      <div class="bar stress"><i style="width:${stressPct}%"></i></div></div>

    <div class="btn-row">
      <button class="btn green" data-action="feed">🍞 Кормить</button>
      <button class="btn" data-action="drill" ${save.satiety<20?"disabled":""}>💪 Тренировать</button>
      <button class="btn secondary" data-action="reset-roach">Сменить таракана</button>
    </div>
  </div>
  <button class="btn wide" data-action="goto-track">Дальше → выбор трассы</button>`;
}

function renderTrackPick(){
  let html = `<div class="card"><h2>Выбери трассу</h2><p class="desc">Каждая трасса по-своему проверяет характеристики.</p>`;
  for(const key in TRACKS){
    const t = TRACKS[key];
    const sel = save.track===key ? "selected":"";
    html += `<div class="track-pick ${sel}" data-track="${key}">
      <div class="tname">${t.name}</div>
      <div class="tdesc">${t.desc}</div>
      <div class="ttags">Дистанция ${t.distance} · важно: ${t.tags.join(", ")}</div>
    </div>`;
  }
  html += `</div>`;
  html += `<button class="btn wide" data-action="goto-race" ${save.track?"":"disabled"}>Дальше → гонка</button>`;
  return html;
}

function renderRace(){
  return `<div class="card">
    <div id="race-canvas-wrap">
      <canvas id="race-canvas" width="680" height="360"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn" id="race-start-btn">🏁 Старт</button>
      <button class="btn secondary" data-action="goto-track">← сменить трассу</button>
    </div>

    <div class="sensor-panel">
      <div class="sensor-btn">
        <label>🎤 Крик/хлопок пугает соперника</label>
        <div class="meter"><i id="mic-meter"></i></div>
        <div class="status" id="mic-status">выкл</div>
        <button class="btn secondary" id="mic-toggle">Включить</button>
      </div>
      <div class="sensor-btn">
        <label>📳 Стук по столу пугает соперника</label>
        <div class="meter"><i id="motion-meter"></i></div>
        <div class="status" id="motion-status">выкл</div>
        <button class="btn secondary" id="motion-toggle">Включить</button>
      </div>
      <div class="hardcore-toggle">
        <input type="checkbox" id="hardcore-check">
        <label for="hardcore-check">Шум может напугать и моего таракана (хардкор)</label>
      </div>
    </div>

    <div id="race-log"></div>
  </div>`;
}

function renderResults(){
  if(!raceEngine || !raceEngine.done) return `<div class="card"><p>Гонка ещё не завершена.</p></div>`;
  const ranking = raceEngine.racers.slice().sort((a,b)=>a.finishOrder-b.finishOrder);
  let html = `<div class="card"><h2>Результаты</h2><ul class="results-list">`;
  ranking.forEach((r,i)=>{
    html += `<li class="${r.isPlayer?'you':''}">
      <div class="place">${i+1}</div>
      <div class="rname">${r.name}${r.isPlayer?' (ты)':''}</div>
      <div class="rtime">${r.finishTime!=null?fmtTime(r.finishTime):'—'}</div>
    </li>`;
  });
  html += `</ul></div>`;
  const place = ranking.findIndex(r=>r.isPlayer)+1;
  html += `<div class="card"><p class="desc">Твой таракан финишировал на ${place} месте из ${ranking.length}.
    ${place===1?" Победа! 🏆":""}</p>
    <div class="btn-row">
      <button class="btn" data-action="goto-track">Другая трасса</button>
      <button class="btn secondary" data-action="goto-train">Ещё потренировать</button>
    </div></div>`;
  return html;
}

function attachHandlers(){
  app.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{
      if(el.disabled) return;
      teardownRace();
      screen = el.dataset.nav;
      render();
    });
  });

  app.querySelectorAll("[data-breed]").forEach(el=>{
    el.addEventListener("click", ()=>{
      save.roach = el.dataset.breed;
      persist();
      render();
    });
  });
  app.querySelectorAll("[data-color]").forEach(el=>{
    el.addEventListener("click", ()=>{
      save.color = el.dataset.color;
      persist();
      render();
    });
  });
  const confirmBtn = app.querySelector("[data-action='confirm-select']");
  if(confirmBtn) confirmBtn.addEventListener("click", ()=>{
    if(!save.roach) return;
    screen = "train";
    render();
  });

  const feedBtn = app.querySelector("[data-action='feed']");
  if(feedBtn) feedBtn.addEventListener("click", ()=>{
    save.satiety = clamp(save.satiety+25,0,100);
    if(save.levels.stamina<10 && Math.random()<0.6) save.levels.stamina = clamp(save.levels.stamina+1,0,10);
    persist(); render();
  });
  const drillBtn = app.querySelector("[data-action='drill']");
  if(drillBtn) drillBtn.addEventListener("click", ()=>{
    if(save.satiety<20) return;
    save.satiety = clamp(save.satiety-20,0,100);
    if(save.levels.speed<10) save.levels.speed = clamp(save.levels.speed+1,0,10);
    if(save.levels.stress<10 && Math.random()<0.35) save.levels.stress = clamp(save.levels.stress+1,0,10);
    persist(); render();
  });
  const resetBtn = app.querySelector("[data-action='reset-roach']");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    if(!confirm("Сбросить текущего таракана и всю тренировку?")) return;
    save = defaultSave();
    persist();
    screen = "select";
    render();
  });

  app.querySelectorAll("[data-track]").forEach(el=>{
    el.addEventListener("click", ()=>{
      save.track = el.dataset.track;
      persist();
      render();
    });
  });

  const gotoTrack = app.querySelector("[data-action='goto-track']");
  if(gotoTrack) gotoTrack.addEventListener("click", ()=>{ teardownRace(); screen="track"; render(); });
  const gotoTrain = app.querySelector("[data-action='goto-train']");
  if(gotoTrain) gotoTrain.addEventListener("click", ()=>{ teardownRace(); screen="train"; render(); });
  const gotoRace = app.querySelector("[data-action='goto-race']");
  if(gotoRace) gotoRace.addEventListener("click", ()=>{ screen="race"; render(); setupRace(); });

  if(screen==="race"){
    if(!raceEngine) setupRace();
    else bindRaceControls();
  }
}

// ---------- Race engine ----------

function makeRacer(name, isPlayer, breedKey, colorHex, levels){
  return {
    name, isPlayer, breedKey, colorHex, levels,
    progress:0, fatigueBase: BREEDS[breedKey].baseStamina * levelBonus(levels.stamina),
    speedBase: BREEDS[breedKey].baseSpeed * levelBonus(levels.speed),
    stressBase: BREEDS[breedKey].baseStress * levelBonus(levels.stress),
    size: BREEDS[breedKey].size,
    wobbleCur:0, wobbleTarget:0, wobbleTimer:0,
    spookTimer:0,
    hesitateTimer:0,
    legPhase: Math.random()*10,
    finished:false, finishTime:null, finishOrder:null,
    obstacleCooldown:{},
  };
}

function randomLevels(peak){
  return {
    speed: Math.round(Math.random()*peak),
    stamina: Math.round(Math.random()*peak),
    stress: Math.round(Math.random()*peak),
  };
}

function setupRace(){
  const trackKey = save.track;
  const track = TRACKS[trackKey];
  const playerColor = COLORS.find(c=>c.id===save.color).hex;
  const player = makeRacer(BREEDS[save.roach].name, true, save.roach, playerColor, save.levels);

  const botBreeds = Object.keys(BREEDS);
  const botColors = COLORS.filter(c=>c.id!==save.color);
  const bots = [];
  const botNames = ["Сосед по опенспейсу","Бухгалтерия","HR-чемпион"];
  for(let i=0;i<3;i++){
    const bk = botBreeds[Math.floor(Math.random()*botBreeds.length)];
    const peak = [2,5,8][i%3];
    bots.push(makeRacer(botNames[i], false, bk, botColors[i%botColors.length].hex, randomLevels(peak)));
  }

  raceEngine = {
    track, trackKey,
    racers:[player,...bots],
    running:false,
    done:false,
    elapsed:0,
    finishedCount:0,
    micActive:false, motionActive:false,
    micStream:null, micCtx:null, micAnalyser:null, micData:null,
    motionHandler:null, motionCooldown:0, micCooldown:0,
    hardcore:false,
    log:[],
    raf:null,
  };
  bindRaceControls();
  drawFrame();
}

function bindRaceControls(){
  const startBtn = document.getElementById("race-start-btn");
  if(startBtn) startBtn.addEventListener("click", startRace);
  const micToggle = document.getElementById("mic-toggle");
  if(micToggle) micToggle.addEventListener("click", toggleMic);
  const motionToggle = document.getElementById("motion-toggle");
  if(motionToggle) motionToggle.addEventListener("click", toggleMotion);
  const hardcore = document.getElementById("hardcore-check");
  if(hardcore) hardcore.addEventListener("change", ()=>{ raceEngine.hardcore = hardcore.checked; });
}

function startRace(){
  if(!raceEngine || raceEngine.running) return;
  raceEngine.running = true;
  raceEngine.lastT = performance.now();
  const btn = document.getElementById("race-start-btn");
  if(btn){ btn.disabled = true; btn.textContent = "Гонка идёт…"; }
  raceEngine.raf = requestAnimationFrame(raceStep);
}

function logMsg(msg){
  raceEngine.log.push(msg);
  const el = document.getElementById("race-log");
  if(el){
    const div = document.createElement("div");
    div.textContent = msg;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }
}

function spookRandomRacer(source){
  const eng = raceEngine;
  const pool = eng.racers.filter(r=>!r.finished && (eng.hardcore || !r.isPlayer));
  if(pool.length===0) return;
  const target = pool[Math.floor(Math.random()*pool.length)];
  const baseDur = 1.1;
  target.spookTimer = Math.max(target.spookTimer, baseDur / target.stressBase);
  target.wobbleTarget = (Math.random()<0.5?-1:1);
  logMsg(`${source} → «${target.name}» испугался и сбился с курса!`);
}

function toggleMic(){
  const eng = raceEngine;
  if(!eng) return;
  const btn = document.getElementById("mic-toggle");
  const status = document.getElementById("mic-status");
  if(eng.micActive){
    if(eng.micStream) eng.micStream.getTracks().forEach(t=>t.stop());
    if(eng.micCtx) eng.micCtx.close();
    eng.micActive=false;
    btn.textContent="Включить"; status.textContent="выкл";
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status.textContent="нет доступа";
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    eng.micStream = stream;
    eng.micCtx = new (window.AudioContext||window.webkitAudioContext)();
    const source = eng.micCtx.createMediaStreamSource(stream);
    eng.micAnalyser = eng.micCtx.createAnalyser();
    eng.micAnalyser.fftSize = 512;
    eng.micData = new Uint8Array(eng.micAnalyser.frequencyBinCount);
    source.connect(eng.micAnalyser);
    eng.micActive = true;
    btn.textContent="Выключить"; status.textContent="слушаю";
  }).catch(()=>{
    status.textContent="доступ запрещён";
  });
}

function toggleMotion(){
  const eng = raceEngine;
  if(!eng) return;
  const btn = document.getElementById("motion-toggle");
  const status = document.getElementById("motion-status");
  if(eng.motionActive){
    if(eng.motionHandler) window.removeEventListener("devicemotion", eng.motionHandler);
    eng.motionActive=false;
    btn.textContent="Включить"; status.textContent="выкл";
    return;
  }
  const enable = ()=>{
    let lastMag = null;
    eng.motionHandler = (e)=>{
      const a = e.acceleration && (e.acceleration.x||e.acceleration.y||e.acceleration.z) ? e.acceleration : e.accelerationIncludingGravity;
      if(!a) return;
      const mag = Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
      if(lastMag!=null){
        const delta = Math.abs(mag-lastMag);
        const meter = document.getElementById("motion-meter");
        if(meter) meter.style.width = clamp(delta*4,0,100)+"%";
        if(delta > 6 && eng.running && eng.motionCooldown<=0){
          eng.motionCooldown = 1.2;
          spookRandomRacer("Стук по столу");
        }
      }
      lastMag = mag;
    };
    window.addEventListener("devicemotion", eng.motionHandler);
    eng.motionActive = true;
    btn.textContent="Выключить"; status.textContent="слушаю";
  };
  if(typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function"){
    DeviceMotionEvent.requestPermission().then(res=>{
      if(res==="granted") enable();
      else status.textContent="доступ запрещён";
    }).catch(()=>{ status.textContent="ошибка доступа"; });
  } else if(typeof DeviceMotionEvent !== "undefined"){
    enable();
  } else {
    status.textContent="нет датчика";
  }
}

function teardownRace(){
  if(!raceEngine) return;
  if(raceEngine.raf) cancelAnimationFrame(raceEngine.raf);
  if(raceEngine.micStream) raceEngine.micStream.getTracks().forEach(t=>t.stop());
  if(raceEngine.micCtx) try{ raceEngine.micCtx.close(); }catch(e){}
  if(raceEngine.motionHandler) window.removeEventListener("devicemotion", raceEngine.motionHandler);
  raceEngine = null;
}

function updateWobble(r, dt, frictionMult){
  r.wobbleTimer -= dt;
  if(r.wobbleTimer<=0){
    r.wobbleTimer = 0.25 + Math.random()*0.4;
    const trained = (r.levels.speed+r.levels.stamina+r.levels.stress)/30;
    const amp = clamp(0.9 - trained*0.55, 0.15, 0.95) * frictionMult;
    r.wobbleTarget = (Math.random()*2-1) * amp;
  }
  r.wobbleCur = lerp(r.wobbleCur, r.wobbleTarget, 1-Math.pow(0.001, dt));
}

function raceStep(t){
  const eng = raceEngine;
  if(!eng || !eng.running) return;
  const dt = Math.min((t-eng.lastT)/1000, 0.05);
  eng.lastT = t;
  eng.elapsed += dt;
  eng.micCooldown = Math.max(0, eng.micCooldown-dt);
  eng.motionCooldown = Math.max(0, eng.motionCooldown-dt);

  if(eng.micActive && eng.micAnalyser){
    eng.micAnalyser.getByteTimeDomainData(eng.micData);
    let sum=0;
    for(let i=0;i<eng.micData.length;i++){ const v=(eng.micData[i]-128)/128; sum+=v*v; }
    const rms = Math.sqrt(sum/eng.micData.length);
    const meter = document.getElementById("mic-meter");
    if(meter) meter.style.width = clamp(rms*400,0,100)+"%";
    if(rms > 0.28 && eng.micCooldown<=0){
      eng.micCooldown = 1.4;
      spookRandomRacer("Громкий звук");
    }
  }

  const track = eng.track;
  for(const r of eng.racers){
    if(r.finished) continue;
    r.spookTimer = Math.max(0, r.spookTimer-dt);
    r.legPhase += dt*8;

    let obstacleMult = 1;
    track.obstacles.forEach((o,idx)=>{
      const opos = o.pos*track.distance;
      const dist = Math.abs(r.progress-opos);
      if(dist < track.distance*0.03){
        obstacleMult = Math.min(obstacleMult, o.slow);
      }
    });

    updateWobble(r, dt, track.friction * (r.spookTimer>0?1.8:1));

    const control = 1 - Math.abs(r.wobbleCur)*0.55;
    const spookMult = r.spookTimer>0 ? 0.45 : 1;
    const raceFrac = clamp(r.progress/track.distance,0,1);
    const fatigueMult = clamp(1 - raceFrac*(0.4/r.fatigueBase), 0.5, 1);

    const pxPerSec = 130;
    const velocity = pxPerSec * r.speedBase * fatigueMult * obstacleMult * control * spookMult;
    r.progress += velocity*dt;

    if(r.progress >= track.distance){
      r.progress = track.distance;
      r.finished = true;
      r.finishTime = eng.elapsed;
      r.finishOrder = eng.finishedCount++;
    }
  }

  if(eng.finishedCount >= eng.racers.length || eng.elapsed > 60){
    eng.racers.forEach(r=>{
      if(!r.finished){ r.finished=true; r.finishTime=eng.elapsed; r.finishOrder=eng.finishedCount++; }
    });
    eng.running = false;
    eng.done = true;
    drawFrame();
    screen = "results";
    render();
    return;
  }

  drawFrame();
  eng.raf = requestAnimationFrame(raceStep);
}

function drawFrame(){
  const canvas = document.getElementById("race-canvas");
  if(!canvas || !raceEngine) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const eng = raceEngine;
  const track = eng.track;
  const laneH = H/eng.racers.length;
  const pad = 30;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#20241c";
  ctx.fillRect(0,0,W,H);

  eng.racers.forEach((r,i)=>{
    const y0 = i*laneH;
    ctx.fillStyle = i%2===0 ? "rgba(255,255,255,0.02)" : "rgba(255,255,255,0.045)";
    ctx.fillRect(0,y0,W,laneH);
  });

  ctx.strokeStyle = "#e0a45855";
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(W-pad,0); ctx.lineTo(W-pad,H);
  ctx.stroke();
  ctx.setLineDash([]);

  track.obstacles.forEach(o=>{
    const x = pad + (o.pos)*(W-pad*2);
    ctx.fillStyle = "#c25b4a";
    ctx.fillRect(x-4,0,8,H);
  });

  eng.racers.forEach((r,i)=>{
    const y = i*laneH + laneH/2;
    const x = pad + (r.progress/track.distance)*(W-pad*2);
    ctx.save();
    ctx.translate(x,y + r.wobbleCur*10);
    ctx.rotate(r.wobbleCur*0.3);
    drawRoach(ctx, r);
    ctx.restore();

    ctx.fillStyle = r.spookTimer>0 ? "#c25b4a" : "#f1ead9";
    ctx.font = "12px sans-serif";
    ctx.fillText((r.isPlayer?"★ ":"")+r.name+(r.spookTimer>0?" 😱":""), 6, y - laneH/2 + 14);
  });
}

function drawRoach(ctx, r){
  const s = r.size*0.85;
  ctx.fillStyle = r.colorHex;
  ctx.strokeStyle = "#1a140d";
  ctx.lineWidth = 1.4;

  ctx.beginPath();
  ctx.ellipse(0,0,s,s*0.6,0,0,Math.PI*2);
  ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(-s*0.55,0,s*0.4,s*0.38,0,0,Math.PI*2);
  ctx.fill(); ctx.stroke();

  const legWave = Math.sin(r.legPhase)*3;
  [-0.15,0.25,0.6].forEach((lx,idx)=>{
    const w = idx%2===0 ? legWave : -legWave;
    ctx.beginPath();
    ctx.moveTo(lx*s, -s*0.5); ctx.lineTo(lx*s-6, -s*1.0-w);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lx*s, s*0.5); ctx.lineTo(lx*s-6, s*1.0+w);
    ctx.stroke();
  });

  ctx.beginPath();
  ctx.moveTo(-s*0.9,-s*0.15); ctx.lineTo(-s*1.5,-s*0.6-legWave);
  ctx.moveTo(-s*0.9,s*0.15); ctx.lineTo(-s*1.5,s*0.6+legWave);
  ctx.stroke();
}

render();
})();
</script>
