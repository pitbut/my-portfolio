<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#131720"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- сетка стола -->
  <g stroke="#1c2333" stroke-width="1">
    <path d="M100 420 L400 240 L700 420" fill="none"/>
    <g opacity="0.6">
      <line x1="130" y1="405" x2="670" y2="405"/>
      <line x1="160" y1="390" x2="640" y2="390"/>
      <line x1="190" y1="375" x2="610" y2="375"/>
      <line x1="220" y1="360" x2="580" y2="360"/>
      <line x1="250" y1="345" x2="550" y2="345"/>
      <line x1="280" y1="330" x2="520" y2="330"/>
      <line x1="310" y1="315" x2="490" y2="315"/>
      <line x1="340" y1="300" x2="460" y2="300"/>
      <line x1="370" y1="285" x2="430" y2="285"/>
    </g>
  </g>

  <!-- «печатаемый» уголок со ступенчатым нависанием -->
  <g stroke="url(#glow)" stroke-width="2.5" fill="none" opacity="0.95">
    <rect x="330" y="130" width="30" height="170"/>
    <path d="M330 130 L470 130 L470 150 L350 150 L350 170 L460 170 L460 190 L350 190"/>
  </g>
  <g fill="#39ff14" opacity="0.85">
    <circle cx="330" cy="130" r="3"/>
    <circle cx="470" cy="130" r="3"/>
    <circle cx="350" cy="190" r="3"/>
  </g>

  <!-- заголовок -->
  <text x="60" y="70" font-family="Courier New, monospace" font-size="30" fill="#ccd6f6" letter-spacing="2">SIXAXIS SLICER</text>
  <text x="60" y="96" font-family="Courier New, monospace" font-size="13" fill="#4a5568" letter-spacing="3">STL → G-CODE · BROWSER SLICER</text>

  <!-- нижние теги -->
  <g font-family="Courier New, monospace" font-size="11" fill="#0e1117">
    <rect x="60" y="380" width="120" height="24" fill="#39ff14"/>
    <text x="72" y="396">NO SUPPORT</text>
    <rect x="190" y="380" width="110" height="24" fill="#00aaff"/>
    <text x="202" y="396">AUTO-ORIENT</text>
    <rect x="310" y="380" width="130" height="24" fill="#ff7d00"/>
    <text x="322" y="396">MULTI-PROCESS</text>
  </g>
</svg>
