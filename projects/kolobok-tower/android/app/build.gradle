plugins {
    id 'com.android.application'
}

// Подпись релиза: создайте android/keystore.properties (см. README.md)
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.robutpit.kolobok'
    compileSdk 35

    defaultConfig {
        applicationId 'com.robutpit.kolobok'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Игра одна и та же для сайта и приложения: берём ../index.html
tasks.register('copyGame', Copy) {
    from(rootProject.file('../index.html'))
    into(file('src/main/assets'))
}
preBuild.dependsOn 'copyGame'
