name = "robutpit-shares-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "site_shares_db"
database_id = "ЗАМЕНИ_НА_ID_ПОСЛЕ_wrangler_d1_create"

[vars]
ALLOWED_ORIGIN = "https://www.robutpit.com"
PAYMENT_CHECKOUT_BASE_URL = "https://checkout.example/pending"
EMAIL_FROM = "Акции сайта <onboarding@resend.dev>"

# Автоматическое ежемесячное начисление дивидендов (бонусными акциями,
# без денег) — 00:05 UTC 1-го числа каждого месяца, см. scheduled() в src/index.js.
[triggers]
crons = ["5 0 1 * *"]

# Секреты (не хранить в этом файле, задавать командой ниже):
#   wrangler secret put PAYME_MERCHANT_ID
#   wrangler secret put PAYME_SECRET_KEY
#   wrangler secret put CLICK_MERCHANT_ID
#   wrangler secret put CLICK_SECRET_KEY
#   wrangler secret put RESEND_API_KEY   — для отправки писем подтверждения email
#                                          (см. DEPLOY.md, "Подтверждение email").
#                                          Пока не задан — письма не уходят, но
#                                          ссылка подтверждения приходит в ответе
#                                          API как dev_verify_link, для тестов.
