<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://www.robutpit.com/projects/shares/login.html">
    <title>Вход — Акции сайта</title>
    <link rel="stylesheet" href="css/shares.css">
</head>
<body>
    <div class="container" style="max-width:420px;">
        <div class="topbar">
            <div class="logo">robutpit.shares</div>
            <select id="lang-select">
                <option value="ru">RU</option>
                <option value="en">EN</option>
                <option value="es">ES</option>
                <option value="pt">PT</option>
                <option value="uz">UZ</option>
                <option value="ar">AR</option>
            </select>
        </div>
        <div class="card">
            <h2 style="margin-bottom:16px; font-size:18px;" data-i18n="login_title">Вход</h2>
            <div class="form-field">
                <label data-i18n="email_label">Email</label>
                <input type="email" id="login-email">
            </div>
            <div class="form-field">
                <label data-i18n="password_label_simple">Пароль</label>
                <input type="password" id="login-password">
            </div>
            <button id="login-btn" style="width:100%;" data-i18n="login_submit">Войти</button>
            <div class="error-msg" id="login-error"></div>
            <div class="detail-hidden" id="resend-row" style="margin-top:8px;">
                <button class="secondary" id="resend-btn" data-i18n="resend_verification_button">Отправить письмо ещё раз</button>
                <div style="font-size:12px; color:#1e824c; margin-top:6px;" id="resend-status"></div>
            </div>
            <p style="margin-top:14px; font-size:13px;">
                <a class="link-inline" href="forgot-password.html" data-i18n="forgot_password_link">Забыли пароль?</a>
            </p>
            <p style="margin-top:8px; font-size:13px;">
                <span data-i18n="no_account">Нет аккаунта?</span>
                <a class="link-inline" href="register.html" data-i18n="register_link">Зарегистрироваться</a>
            </p>
        </div>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById("login-btn").addEventListener("click", async function () {
            const errorEl = document.getElementById("login-error");
            const resendRow = document.getElementById("resend-row");
            errorEl.textContent = "";
            resendRow.classList.add("detail-hidden");
            try {
                const data = await api("/api/login", {
                    method: "POST",
                    body: {
                        email: document.getElementById("login-email").value,
                        password: document.getElementById("login-password").value,
                    },
                });
                localStorage.setItem("shares_token", data.token);
                window.location.href = "cabinet.html";
            } catch (e) {
                errorEl.textContent = e.message;
                if (e.data && e.data.needs_verification) {
                    resendRow.classList.remove("detail-hidden");
                }
            }
        });

        document.getElementById("resend-btn").addEventListener("click", async function () {
            const statusEl = document.getElementById("resend-status");
            statusEl.textContent = "";
            try {
                const res = await api("/api/resend-verification", {
                    method: "POST",
                    body: { email: document.getElementById("login-email").value },
                });
                statusEl.textContent = t("resend_verification_sent");
                if (res.dev_verify_link) {
                    statusEl.innerHTML +=
                        " <a class='link-inline' href='" + res.dev_verify_link + "'>" + t("dev_verify_link_label") + "</a>";
                }
            } catch (e) {
                statusEl.style.color = "#c0392b";
                statusEl.textContent = e.message;
            }
        });
    </script>
</body>
</html>
