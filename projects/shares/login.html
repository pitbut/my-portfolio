<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://www.robutpit.com/projects/shares/login.html">
    <title>Вход — Акции сайта</title>
    <link rel="stylesheet" href="css/shares.css">
</head>
<body>
    <div class="container" style="max-width:420px;">
        <div class="topbar"><div class="logo">robutpit.shares</div></div>
        <div class="card">
            <h2 style="margin-bottom:16px; font-size:18px;">Вход</h2>
            <div class="form-field">
                <label>Email</label>
                <input type="email" id="login-email">
            </div>
            <div class="form-field">
                <label>Пароль</label>
                <input type="password" id="login-password">
            </div>
            <button id="login-btn" style="width:100%;">Войти</button>
            <div class="error-msg" id="login-error"></div>
            <p style="margin-top:14px; font-size:13px;">Нет аккаунта? <a class="link-inline" href="register.html">Зарегистрироваться</a></p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        document.getElementById("login-btn").addEventListener("click", async function () {
            const errorEl = document.getElementById("login-error");
            errorEl.textContent = "";
            try {
                const data = await api("/api/login", {
                    method: "POST",
                    body: {
                        email: document.getElementById("login-email").value,
                        password: document.getElementById("login-password").value,
                    },
                });
                localStorage.setItem("shares_token", data.token);
                window.location.href = "cabinet.html";
            } catch (e) {
                errorEl.textContent = e.message;
            }
        });
    </script>
</body>
</html>
