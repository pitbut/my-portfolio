<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Акции сайта</title>
    <link rel="stylesheet" href="css/shares.css">
    <style>
        table.admin-users { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.admin-users th { text-align: left; color: #777; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #eee; }
        table.admin-users td { padding: 8px; border-bottom: 1px solid #f2f2f2; }
        table.admin-users tr:hover { background: #fafafa; cursor: pointer; }
        .detail-hidden { display: none; }
        .ledger-row { font-size: 12px; color: #555; padding: 4px 0; border-bottom: 1px dashed #eee; }
        .msg-item { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #eee; }
        .msg-item .msg-date { color: #999; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <div class="topbar">
            <div class="logo">robutpit.shares · admin</div>
            <a class="link-inline" href="index.html">На главную</a>
        </div>

        <div id="access-denied" class="card detail-hidden">
            У этого аккаунта нет прав администратора.
        </div>

        <div id="admin-content">
            <div class="card">
                <strong>Держатели акций</strong>
                <table class="admin-users" style="margin-top:12px;">
                    <thead>
                        <tr><th>Имя</th><th>Email</th><th>Акций</th><th>Регистрация</th></tr>
                    </thead>
                    <tbody id="users-table-body"></tbody>
                </table>
            </div>

            <div class="card detail-hidden" id="user-detail-card">
                <h3 id="detail-name" style="font-size:16px; margin-bottom:6px;"></h3>
                <p style="font-size:13px; color:#666; margin-bottom:10px;" id="detail-email"></p>
                <p style="font-size:13px; margin-bottom:4px;">Акций: <strong id="detail-shares"></strong></p>
                <p style="font-size:13px; margin-bottom:14px;">Приглашено друзей: <strong id="detail-referred"></strong></p>

                <strong style="font-size:13px;">История операций</strong>
                <div id="detail-ledger" style="margin:8px 0 16px;"></div>

                <strong style="font-size:13px;">Написать сообщение</strong>
                <div class="buy-row" style="margin-top:8px;">
                    <input type="text" id="message-body" placeholder="Текст сообщения" style="flex:1;">
                    <button id="send-message-btn">Отправить</button>
                </div>
                <div class="error-msg" id="message-error"></div>

                <strong style="font-size:13px; display:block; margin-top:16px;">Отправленные сообщения</strong>
                <div id="detail-messages"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
