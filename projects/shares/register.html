<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://www.robutpit.com/projects/shares/register.html">
    <title>Регистрация — Акции сайта</title>
    <link rel="stylesheet" href="css/shares.css">
</head>
<body>
    <div class="container" style="max-width:420px;">
        <div class="topbar"><div class="logo">robutpit.shares</div></div>
        <div class="card">
            <h2 style="margin-bottom:16px; font-size:18px;">Регистрация</h2>
            <div class="form-field">
                <label>Имя</label>
                <input type="text" id="reg-name">
            </div>
            <div class="form-field">
                <label>Email</label>
                <input type="email" id="reg-email">
            </div>
            <div class="form-field">
                <label>Пароль (минимум 8 символов)</label>
                <input type="password" id="reg-password">
            </div>
            <button id="reg-btn" style="width:100%;">Зарегистрироваться</button>
            <div class="error-msg" id="reg-error"></div>
            <p style="margin-top:14px; font-size:13px;">Уже есть аккаунт? <a class="link-inline" href="login.html">Войти</a></p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        document.getElementById("reg-btn").addEventListener("click", async function () {
            const errorEl = document.getElementById("reg-error");
            errorEl.textContent = "";
            try {
                const data = await api("/api/register", {
                    method: "POST",
                    body: {
                        display_name: document.getElementById("reg-name").value,
                        email: document.getElementById("reg-email").value,
                        password: document.getElementById("reg-password").value,
                        ref: getReferralCodeFromUrl(),
                        language: "ru",
                    },
                });
                localStorage.setItem("shares_token", data.token);
                window.location.href = "cabinet.html";
            } catch (e) {
                errorEl.textContent = e.message;
            }
        });
    </script>
</body>
</html>
