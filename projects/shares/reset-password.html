<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://www.robutpit.com/projects/shares/reset-password.html">
    <title>Новый пароль — Акции сайта</title>
    <link rel="stylesheet" href="css/shares.css">
</head>
<body>
    <div class="container" style="max-width:420px;">
        <div class="topbar">
            <div class="logo">robutpit.shares</div>
        </div>
        <div class="card">
            <h2 style="margin-bottom:16px; font-size:18px;" data-i18n="reset_password_title">Новый пароль</h2>

            <div id="reset-form">
                <div class="form-field">
                    <label data-i18n="new_password_label">Новый пароль (минимум 8 символов)</label>
                    <input type="password" id="reset-password">
                </div>
                <button id="reset-btn" style="width:100%;" data-i18n="reset_password_submit">Сохранить пароль</button>
            </div>
            <div class="error-msg" id="reset-error"></div>
            <div class="detail-hidden" id="reset-success" style="font-size:13px; color:#1e824c; margin-top:8px;"></div>

            <p style="margin-top:14px; font-size:13px;">
                <a class="link-inline" href="login.html" data-i18n="login_link">Войти</a>
            </p>
        </div>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script>
        const resetToken = new URLSearchParams(window.location.search).get("token");
        if (!resetToken) {
            document.getElementById("reset-form").classList.add("detail-hidden");
            document.getElementById("reset-error").textContent = t("reset_missing_token");
        }

        document.getElementById("reset-btn").addEventListener("click", async function () {
            const errorEl = document.getElementById("reset-error");
            const successEl = document.getElementById("reset-success");
            errorEl.textContent = "";
            try {
                await api("/api/reset-password", {
                    method: "POST",
                    body: { token: resetToken, password: document.getElementById("reset-password").value },
                });
                document.getElementById("reset-form").classList.add("detail-hidden");
                successEl.textContent = t("reset_password_success");
                successEl.classList.remove("detail-hidden");
                setTimeout(function () {
                    window.location.href = "login.html";
                }, 1500);
            } catch (e) {
                errorEl.textContent = e.message;
            }
        });
    </script>
</body>
</html>
