<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://www.robutpit.com/projects/shares/forgot-password.html">
    <title>Восстановление пароля — Акции сайта</title>
    <link rel="stylesheet" href="css/shares.css">
</head>
<body>
    <div class="container" style="max-width:420px;">
        <div class="topbar">
            <div class="logo">robutpit.shares</div>
            <select id="lang-select">
                <option value="ru">RU</option>
                <option value="en">EN</option>
                <option value="es">ES</option>
                <option value="pt">PT</option>
                <option value="uz">UZ</option>
                <option value="ar">AR</option>
            </select>
        </div>
        <div class="card">
            <h2 style="margin-bottom:16px; font-size:18px;" data-i18n="forgot_password_title">Восстановление пароля</h2>
            <p style="font-size:13px; color:#666; margin-bottom:14px;" data-i18n="forgot_password_hint">Укажи email, с которым регистрировался(лась) — пришлём ссылку для установки нового пароля.</p>
            <div class="form-field">
                <label data-i18n="email_label">Email</label>
                <input type="email" id="forgot-email">
            </div>
            <button id="forgot-btn" style="width:100%;" data-i18n="forgot_password_submit">Отправить ссылку</button>
            <div class="error-msg" id="forgot-error"></div>
            <div class="detail-hidden" id="forgot-success" style="font-size:13px; color:#1e824c; margin-top:8px;"></div>
            <p style="margin-top:14px; font-size:13px;">
                <a class="link-inline" href="login.html" data-i18n="login_link">Войти</a>
            </p>
        </div>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById("forgot-btn").addEventListener("click", async function () {
            const errorEl = document.getElementById("forgot-error");
            const successEl = document.getElementById("forgot-success");
            errorEl.textContent = "";
            try {
                const res = await api("/api/forgot-password", {
                    method: "POST",
                    body: { email: document.getElementById("forgot-email").value },
                });
                document.getElementById("forgot-btn").setAttribute("disabled", "disabled");
                successEl.textContent = t("forgot_password_sent");
                successEl.classList.remove("detail-hidden");
                if (res.dev_reset_link) {
                    successEl.innerHTML +=
                        "<br><a class='link-inline' href='" + res.dev_reset_link + "'>" + t("dev_verify_link_label") + "</a>";
                }
            } catch (e) {
                errorEl.textContent = e.message;
            }
        });
    </script>
</body>
</html>
