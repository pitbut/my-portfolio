{% extends "base.html" %}
{% block title %}Регистрация — Собутыльник{% endblock %}
{% block content %}
<div class="wrap" style="max-width:480px;">
  <h1>Регистрация</h1>
  <p style="color:var(--ink-dim)">Полноценное общение с собутыльником доступно после подтверждения email.</p>
  <form class="stack" method="post">
    <div>
      <label for="name">Имя</label>
      <input type="text" id="name" name="name" value="{{ name }}" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" required>
    </div>
    <div>
      <label for="password">Пароль (от 8 символов)</label>
      <input type="password" id="password" name="password" required minlength="8">
    </div>
    <div>
      <label for="password2">Повторите пароль</label>
      <input type="password" id="password2" name="password2" required minlength="8">
    </div>
    <label class="check-row">
      <input type="checkbox" name="age_confirm" required>
      <span>Подтверждаю, что мне есть 18 лет. Сервис посвящён тематике застолья и не предназначен для несовершеннолетних.</span>
    </label>
    <button class="btn" type="submit">Зарегистрироваться</button>
  </form>
  <p style="margin-top:16px; color:var(--ink-dim); font-size:.9rem;">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
</div>
{% endblock %}
