# Новый nginx server-блок для «Собутыльника» — на отдельном (под)домене,
# отдельным файлом. НЕ добавляйте это в существующий server-блок вашего
# сайта и не редактируйте существующие файлы в sites-available — только
# новый файл, чтобы не задеть то, что уже работает.
#
# Установка (см. подробности в deploy/DEPLOY.md):
#   sudo cp deploy/nginx-sobutylnik.conf /etc/nginx/sites-available/sobutylnik.conf
#   # замените SOBUTYLNIK.VASH-DOMEN.RU ниже на реальный поддомен
#   sudo ln -s /etc/nginx/sites-available/sobutylnik.conf /etc/nginx/sites-enabled/sobutylnik.conf
#   sudo nginx -t          # ОБЯЗАТЕЛЬНО проверить конфиг перед применением
#   sudo systemctl reload nginx    # reload, не restart — не рвёт текущие соединения
#
# Сертификат для этого поддомена добавляется отдельной командой certbot
# (см. DEPLOY.md) — она не трогает сертификаты других доменов на сервере.

server {
    listen 80;
    listen [::]:80;
    server_name SOBUTYLNIK.VASH-DOMEN.RU;

    client_max_body_size 12m;  # с запасом выше MAX_UPLOAD_SIZE приложения (10 МБ) — фото/файлы в чате

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# certbot --nginx сам допишет сюда блок на 443 с SSL при выпуске
# сертификата — вручную ничего добавлять не нужно.
