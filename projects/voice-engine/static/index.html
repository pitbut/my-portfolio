<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Voice Engine — демо</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  select, textarea { width: 100%; padding: 8px; box-sizing: border-box; margin: 8px 0; }
  button { padding: 8px 16px; cursor: pointer; }
  .error { color: #c0392b; }
</style>
</head>
<body>
  <h1>Озвучка текста</h1>
  <p>Это то, что в итоге увидит обычный посетитель: выбор готового голоса из списка, без каких-либо деталей о том, как он был создан.</p>

  <label for="voice">Голос</label>
  <select id="voice"></select>

  <label for="text">Текст</label>
  <textarea id="text" rows="4" placeholder="Что озвучить?"></textarea>

  <button onclick="speak()">Озвучить</button>
  <p id="status"></p>
  <audio id="player" controls style="width:100%; margin-top: 12px; display:none;"></audio>

<script>
async function loadVoices() {
  const res = await fetch('/api/voices');
  const voices = await res.json();
  const select = document.getElementById('voice');
  select.innerHTML = '';
  if (voices.length === 0) {
    select.innerHTML = '<option value="">Голосов пока нет — добавьте через /admin</option>';
    return;
  }
  for (const v of voices) {
    const opt = document.createElement('option');
    opt.value = v.id;
    opt.textContent = v.name;
    select.appendChild(opt);
  }
}

async function speak() {
  const voiceId = document.getElementById('voice').value;
  const text = document.getElementById('text').value.trim();
  const statusEl = document.getElementById('status');
  const player = document.getElementById('player');
  statusEl.textContent = '';

  if (!voiceId) { statusEl.innerHTML = '<span class="error">Сначала выберите голос.</span>'; return; }
  if (!text) { statusEl.innerHTML = '<span class="error">Введите текст.</span>'; return; }

  statusEl.textContent = 'Синтезирую…';
  try {
    const res = await fetch('/api/speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voice_id: voiceId }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      statusEl.innerHTML = '<span class="error">' + (data.error || 'Ошибка синтеза') + '</span>';
      return;
    }
    const blob = await res.blob();
    player.src = URL.createObjectURL(blob);
    player.style.display = 'block';
    player.play();
    statusEl.textContent = '';
  } catch (e) {
    statusEl.innerHTML = '<span class="error">Ошибка соединения: ' + e + '</span>';
  }
}

loadVoices();
</script>
</body>
</html>
