# Шаблон конфига Nginx как обратного прокси перед сервером-релеем.
# Поставьте файл в /etc/nginx/sites-available/rynok-relay, замените
# rynok.ВАШ-ДОМЕН.ru на реальный домен/поддомен, включите симлинком
# в sites-enabled, а TLS-блок допишет certbot автоматически (см. DEPLOY.md).

server {
    listen 80;
    server_name rynok.ВАШ-ДОМЕН.ru;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Обязательно для WebSocket (wss://.../ws) — иначе апгрейд соединения не пройдёт.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-соединение живёт долго — не обрываем по таймауту простоя.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
