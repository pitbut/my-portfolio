{% extends "base.html" %}
{% block title %}Добавить книгу — Исток{% endblock %}

{% block content %}
<section class="section wrap" style="max-width: 520px;">
  <div class="breadcrumb"><a href="{{ url_for('library.index') }}">Библиотека</a> / {{ _('Добавить') }}</div>
  <div class="section__header">
    <h2>{{ _('Добавить книгу') }}</h2>
  </div>
  <p class="prose">
    Книга появится в библиотеке сразу с пометкой «не проверено» —
    администрация проверит сведения и подтвердит их.
  </p>

  <form method="post" enctype="multipart/form-data">
    <div class="field">
      <label for="title">{{ _('Название') }}</label>
      <input type="text" id="title" name="title" maxlength="255" required>
    </div>

    <div class="field">
      <label for="author">{{ _('Автор') }}</label>
      <input type="text" id="author" name="author" maxlength="255" required>
    </div>

    <div class="field">
      <label for="year">{{ _('Год издания (необязательно)') }}</label>
      <input type="text" id="year" name="year" placeholder="2020">
    </div>

    <div class="field">
      <label for="genre">{{ _('Жанр (необязательно)') }}</label>
      <input type="text" id="genre" name="genre" maxlength="120">
    </div>

    <div class="field">
      <label for="description">{{ _('Описание') }}</label>
      <textarea id="description" name="description" rows="5" required></textarea>
    </div>

    <div class="field">
      <label for="cover">{{ _('Обложка (необязательно)') }}</label>
      <input type="file" id="cover" name="cover" accept="image/*">
    </div>

    <button type="submit" class="btn btn--primary">{{ _('Добавить') }}</button>
  </form>
</section>
{% endblock %}
