{% extends "base.html" %}
{% block title %}Новый пароль — Исток{% endblock %}

{% block content %}
<section class="section wrap" style="max-width: 420px;">
  <div class="section__header">
    <h2>{{ _('Новый пароль') }}</h2>
  </div>
  <form method="post">
    <div class="field">
      <label for="password">{{ _('Новый пароль (не короче 8 символов)') }}</label>
      <input type="password" id="password" name="password" required minlength="8" autofocus>
    </div>
    <div class="field">
      <label for="password2">{{ _('Повторите пароль') }}</label>
      <input type="password" id="password2" name="password2" required minlength="8">
    </div>
    <button type="submit" class="btn btn--primary">{{ _('Сохранить пароль') }}</button>
  </form>
</section>
{% endblock %}
