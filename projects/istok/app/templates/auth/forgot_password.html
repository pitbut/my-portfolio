{% extends "base.html" %}
{% block title %}Восстановление пароля — Исток{% endblock %}

{% block content %}
<section class="section wrap" style="max-width: 420px;">
  <div class="section__header">
    <h2>{{ _('Восстановление пароля') }}</h2>
  </div>
  <p class="prose">{{ _('Укажите email, с которым вы регистрировались — пришлём ссылку для смены пароля.') }}</p>
  <form method="post">
    <div class="field">
      <label for="email">{{ _('Email') }}</label>
      <input type="text" id="email" name="email" value="{{ email }}" required autofocus>
    </div>
    <button type="submit" class="btn btn--primary">{{ _('Отправить ссылку') }}</button>
  </form>
  <p class="prose" style="margin-top:16px;">{{ _('Вспомнили пароль?') }} <a href="{{ url_for('auth.login') }}">{{ _('Войти') }}</a></p>
</section>
{% endblock %}
