<div class="section__header">
  <h2>{{ admin_title }}</h2>
  <span class="admin-item__meta">👁 {{ "{:,}".format(total_views).replace(",", " ") }} просмотров сайта</span>
  <a class="see-all" href="{{ url_for('admin.logout') }}">Выйти</a>
</div>
<div class="sort-bar">
  <a href="{{ url_for('admin.suggestions') }}" class="{{ 'is-active' if request.endpoint == 'admin.suggestions' }}">Правки источников</a>
  <a href="{{ url_for('admin.suppliers') }}" class="{{ 'is-active' if request.endpoint == 'admin.suppliers' }}">Точки продажи</a>
  <a href="{{ url_for('admin.water_brands') }}" class="{{ 'is-active' if request.endpoint == 'admin.water_brands' }}">Марки воды</a>
  <a href="{{ url_for('admin.equipment') }}" class="{{ 'is-active' if request.endpoint == 'admin.equipment' }}">Оборудование</a>
  <a href="{{ url_for('admin.reviews') }}" class="{{ 'is-active' if request.endpoint == 'admin.reviews' }}">Отзывы</a>
  <a href="{{ url_for('admin.messages') }}" class="{{ 'is-active' if request.endpoint == 'admin.messages' }}">Сообщения</a>
  <a href="{{ url_for('admin.users') }}" class="{{ 'is-active' if request.endpoint in ('admin.users', 'admin.user_detail') }}">Пользователи</a>
  <a href="{{ url_for('admin.banners') }}" class="{{ 'is-active' if request.endpoint in ('admin.banners', 'admin.edit_banner') }}">Баннеры</a>
</div>
