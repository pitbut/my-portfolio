{% extends "base.html" %}
{% block title %}Добавить статью — Исток{% endblock %}

{% block content %}
<section class="section wrap" style="max-width: 620px;">
  <div class="breadcrumb"><a href="{{ url_for('articles.index') }}">Статьи</a> / {{ _('Добавить') }}</div>
  <div class="section__header">
    <h2>{{ _('Добавить статью') }}</h2>
  </div>
  <p class="prose">
    Статья появится на сайте сразу с пометкой «не проверено» —
    администрация проверит текст и подтвердит его.
  </p>

  <form method="post" enctype="multipart/form-data">
    <div class="field">
      <label for="title">{{ _('Заголовок') }}</label>
      <input type="text" id="title" name="title" maxlength="255" required>
    </div>

    <div class="field">
      <label for="category">{{ _('Рубрика') }}</label>
      <input type="text" id="category" name="category" maxlength="120" required>
    </div>

    <div class="field">
      <label for="summary">{{ _('Краткое содержание (необязательно)') }}</label>
      <input type="text" id="summary" name="summary" maxlength="500">
    </div>

    <div class="field">
      <label for="body">{{ _('Текст статьи') }}</label>
      <textarea id="body" name="body" rows="10" required></textarea>
    </div>

    <div class="field">
      <label for="cover">{{ _('Обложка (необязательно)') }}</label>
      <input type="file" id="cover" name="cover" accept="image/*">
    </div>

    <button type="submit" class="btn btn--primary">{{ _('Добавить') }}</button>
  </form>
</section>
{% endblock %}
