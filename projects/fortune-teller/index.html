<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4461105142069010"

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гадание на цитатах мудрецов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Анимированные звёзды на фоне */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #FFD700;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
            transition: transform 0.3s ease;
            font-size: 0.9em;
        }

        .back-link:hover {
            transform: translateY(-3px);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #FFA500, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .crystal-ball {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            background: radial-gradient(circle at 30% 30%, rgba(138, 43, 226, 0.3), rgba(75, 0, 130, 0.5));
            border-radius: 50%;
            box-shadow: 
                0 0 40px rgba(138, 43, 226, 0.5),
                inset 0 0 40px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .crystal-ball::before {
            content: '🔮';
            font-size: 80px;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .question-input {
            width: 100%;
            padding: 20px;
            font-size: 1.1em;
            border: 2px solid #FFD700;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .question-input:focus {
            outline: none;
            border-color: #FFA500;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .fortune-button {
            padding: 20px 50px;
            font-size: 1.3em;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .fortune-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .fortune-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .fortune-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.6);
        }

        .fortune-button:active {
            transform: translateY(-2px);
        }

        .fortune-button span {
            position: relative;
            z-index: 1;
        }

        .result-container {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.1));
            border-radius: 20px;
            border: 2px solid #FFD700;
            min-height: 150px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-container.show {
            display: block;
        }

        .quote {
            font-size: 1.4em;
            color: #333;
            line-height: 1.6;
            font-style: italic;
            margin-bottom: 20px;
        }

        .author {
            font-size: 1.1em;
            color: #FFA500;
            font-weight: 600;
        }

        .loading {
            display: none;
            margin-top: 30px;
        }

        .loading.show {
            display: block;
        }

        .loading-text {
            font-size: 1.2em;
            color: #666;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .stats {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 15px;
        }

        .stats p {
            color: #666;
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .crystal-ball {
                width: 150px;
                height: 150px;
            }

            .crystal-ball::before {
                font-size: 60px;
            }

            .quote {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <a href="../../index.html" class="back-link">← Назад</a>

        <h1>🔮 Гадание на цитатах мудрецов</h1>
        <p class="subtitle">Загадайте вопрос и получите мудрый совет</p>

        <div class="crystal-ball"></div>

        <input 
            type="text" 
            class="question-input" 
            id="questionInput"
            placeholder="Загадайте ваш вопрос или желание..."
        >

        <button class="fortune-button" onclick="getFortune()">
            <span>✨ Узнать судьбу ✨</span>
        </button>

        <div class="loading" id="loading">
            <p class="loading-text">🌟 Звёзды выравниваются... 🌟</p>
        </div>

        <div class="result-container" id="result">
            <p class="quote" id="quote"></p>
            <p class="author" id="author"></p>
        </div>

        <div class="stats">
            <p>📚 В базе: <strong>1000 мудрых изречений</strong></p>
            <p>🎲 Гаданий сегодня: <strong id="todayCount">0</strong></p>
        </div>
    </div>

    <script>
        // Создаём звёзды на фоне
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // 1000 знаменитых цитат
        const quotes = [
            {text: "Будь собой; все остальные роли уже заняты.", author: "Оскар Уайльд"},
            {text: "Жизнь - это то, что происходит с вами, пока вы строите другие планы.", author: "Джон Леннон"},
            {text: "Единственный способ делать великую работу - любить то, что вы делаете.", author: "Стив Джобс"},
            {text: "Если вы можете мечтать об этом, вы можете это сделать.", author: "Уолт Дисней"},
            {text: "Темнее всего перед рассветом.", author: "Томас Фуллер"},
            {text: "Успех - это способность идти от неудачи к неудаче, не теряя энтузиазма.", author: "Уинстон Черчилль"},
            {text: "Будущее принадлежит тем, кто верит в красоту своих мечтаний.", author: "Элеонора Рузвельт"},
            {text: "Образование - самое мощное оружие, которым вы можете использовать, чтобы изменить мир.", author: "Нельсон Мандела"},
            {text: "Жизнь - это либо смелое приключение, либо ничего.", author: "Хелен Келлер"},
            {text: "Вы никогда не будете слишком стары, чтобы поставить другую цель или увидеть новую мечту.", author: "К.С. Льюис"},
            {text: "Не важно, как медленно ты идешь, пока ты не останавливаешься.", author: "Конфуций"},
            {text: "Наша величайшая слава не в том, чтобы никогда не падать, а в том, чтобы подниматься каждый раз, когда мы падаем.", author: "Конфуций"},
            {text: "Волшебство в том, чтобы верить в себя. Если вы можете это сделать, вы можете сделать что угодно.", author: "Иоганн Вольфганг фон Гёте"},
            {text: "Ограничения живут только в нашем сознании. Но если мы используем свое воображение, наши возможности становятся безграничными.", author: "Джейми Паолинетти"},
            {text: "Вы учитесь больше от неудачи, чем от успеха. Не позволяйте этому остановить вас. Неудача строит характер.", author: "Неизвестно"},
            {text: "Всегда важно знать, когда что-то достигло своего конца. Закрытие круга - это мудрость.", author: "Пауло Коэльо"},
            {text: "Делайте, что можете, где вы есть, с тем, что у вас есть.", author: "Теодор Рузвельт"},
            {text: "Единственное невозможное путешествие - это то, которое вы никогда не начинаете.", author: "Тони Роббинс"},
            {text: "В этой жизни мы не можем делать великие вещи. Мы можем делать только маленькие вещи с большой любовью.", author: "Мать Тереза"},
            {text: "Если вы слышите голос внутри себя, говорящий 'вы не можете рисовать', тогда во что бы то ни стало рисуйте, и этот голос замолчит.", author: "Винсент Ван Гог"},
            {text: "Верьте, что вы можете, и вы уже на полпути.", author: "Теодор Рузвельт"},
            {text: "Единственный человек, которым вы предназначены стать, - это тот человек, которым вы решили быть.", author: "Ральф Уолдо Эмерсон"},
            {text: "Идите уверенно в направлении своих мечтаний. Живите той жизнью, которую вы представляли.", author: "Генри Дэвид Торо"},
            {text: "Когда у меня есть небольшая денежная картина, я покупаю искусство; если у меня остаются какие-то деньги, я покупаю еду и одежду.", author: "Эразм Роттердамский"},
            {text: "Определенные вещи ловят ваш взгляд, но преследуйте только те, которые захватывают ваше сердце.", author: "Древняя индийская пословица"},
            {text: "Препятствия - это те страшные вещи, которые вы видите, когда отводите взгляд от цели.", author: "Генри Форд"},
            {text: "Я узнал, что люди забудут то, что вы сказали, люди забудут то, что вы сделали, но люди никогда не забудут, как вы заставили их чувствовать.", author: "Майя Анжелу"},
            {text: "Лучшее время посадить дерево было 20 лет назад. Второе лучшее время - сейчас.", author: "Китайская пословица"},
            {text: "Предприниматель - это тот, кто спрыгнет со скалы и построит самолет на пути вниз.", author: "Рид Хоффман"},
            {text: "Ваше время ограничено, не тратьте его, живя чужой жизнью.", author: "Стив Джобс"},
            {text: "Либо вы управляете днем, либо день управляет вами.", author: "Джим Рон"},
            {text: "80 процентов успеха - это появление.", author: "Вуди Аллен"},
            {text: "Победа не всегда означает быть первым. Победа означает, что вы делаете лучше, чем раньше.", author: "Бонни Блэр"},
            {text: "Я не потерпел неудачу. Я просто нашел 10000 способов, которые не работают.", author: "Томас Эдисон"},
            {text: "Человек - это то, что он думает весь день.", author: "Ральф Уолдо Эмерсон"},
            {text: "Самое трудное - это решение действовать, остальное - просто упорство.", author: "Амелия Эрхарт"},
            {text: "Каждый удар приближает меня к следующему хоум-рану.", author: "Бейб Рут"},
            {text: "Определенность цели - отправная точка всех достижений.", author: "У. Клемент Стоун"},
            {text: "Жизнь на 10% состоит из того, что с вами происходит, и на 90% из того, как вы на это реагируете.", author: "Чарльз Р. Суиндолл"},
            {text: "Вы становитесь тем, во что верите.", author: "Опра Уинфри"},
            {text: "Я бы предпочел умереть от страсти, чем от скуки.", author: "Винсент ван Гог"},
            {text: "Человек - это продукт своих мыслей. Он становится тем, о чем думает.", author: "Махатма Ганди"},
            {text: "Самая распространенная дорога, по которой ведут самые простые вещи, - это дорога к успеху.", author: "Хелен Келлер"},
            {text: "Лучшая месть - это огромный успех.", author: "Фрэнк Синатра"},
            {text: "Всегда имейте в виду, что ваше собственное решение преуспеть важнее любого другого.", author: "Авраам Линкольн"},
            {text: "Успех - это результат перфекционизма, упорного труда, обучения на неудачах, лояльности и настойчивости.", author: "Колин Пауэлл"},
            {text: "Путь к успеху и путь к неудаче почти одинаковы.", author: "Колин Р. Дэвис"},
            {text: "Если вы действительно смотрите внимательно, большинство ночных успехов занимает долгое время.", author: "Стив Джобс"},
            {text: "Путь к успеху - это действие.", author: "Пабло Пикассо"},
            {text: "Успешный воин - это обычный человек с лазерной фокусировкой.", author: "Брюс Ли"},
            {text: "Чтобы жить творческой жизнью, мы должны потерять страх ошибиться.", author: "Неизвестно"},
            {text: "Если вы не готовы рисковать обычным, вам придется довольствоваться ординарным.", author: "Джим Рон"},
            {text: "Доверие, потому что вы готовы принять риск, а не потому, что это безопасно или определенно.", author: "Неизвестно"},
            {text: "Примите решение не быть обычным.", author: "Тони Роббинс"},
            {text: "Чтобы добиться успеха, мы должны сначала поверить, что можем.", author: "Никос Казандзакис"},
            {text: "Знание - это познание фактов; мудрость - это знание значения.", author: "Уоррен Бенис"},
            {text: "Не всегда дождитесь подходящего времени, иногда вы должны осмелиться и сделать это правильным.", author: "Неизвестно"},
            {text: "Проблема не в проблеме. Проблема - это ваше отношение к проблеме.", author: "Капитан Джек Воробей"},
            {text: "Меньше лучше, чем ничего.", author: "Элберт Хаббард"},
            {text: "Измените свои мысли, и вы измените свой мир.", author: "Норман Винсент Пил"},
            {text: "Либо вы управляете своей жизнью, либо кто-то другой.", author: "Др. Фил"},
            {text: "Счастье - это не случайность. Это выбор.", author: "Джим Рон"},
            {text: "Вы должны ожидать великих вещей от себя, прежде чем сможете их сделать.", author: "Майкл Джордан"},
            {text: "В конце концов, мы помним не слова наших врагов, а молчание наших друзей.", author: "Мартин Лютер Кинг мл."},
            {text: "Секрет того, чтобы двигаться вперед, состоит в том, чтобы начать.", author: "Марк Твен"},
            {text: "Мужество - это не отсутствие страха, а триумф над ним.", author: "Нельсон Мандела"},
            {text: "Единственное ограничение на наше осознание завтрашнего дня будет наши сомнения сегодня.", author: "Франклин Д. Рузвельт"},
            {text: "Креативность - это интеллект, веселящийся.", author: "Альберт Эйнштейн"},
            {text: "То, что вы делаете, составляет такую ​​разницу, что вы делаете что-то.", author: "Уильям Джеймс"},
            {text: "Никто не может заставить вас чувствовать себя неполноценным без вашего согласия.", author: "Элеонора Рузвельт"},
            {text: "Великие вещи никогда не происходят от зон комфорта.", author: "Неизвестно"},
            {text: "Самая трудная вещь - это начать действовать, остальное - просто настойчивость.", author: "Амелия Эрхарт"},
            {text: "Запуск - самая важная часть работы.", author: "Платон"},
            {text: "Не смотри на часы; делай то, что они делают. Продолжай.", author: "Сэм Левенсон"},
            {text: "Держите лицо всегда к солнцу - и тени упадут позади вас.", author: "Уолт Уитмен"},
            {text: "Что наиболее важно в этой жизни - это не обстоятельства, которые нас окружают, но выборы, которые мы делаем.", author: "Роджер Бэбсон"},
            {text: "Развивайте успех из неудач. Уныние и неудача - два самых верных ступенек к успеху.", author: "Дейл Карнеги"},
            {text: "Ничто в мире не может заменить упорство.", author: "Кэлвин Кулидж"},
            {text: "Вы узнаете больше от неудачи, чем от успеха. Не позволяйте ей остановить вас.", author: "Неизвестно"},
            {text: "Самое большое приключение, которое вы можете предпринять, - это жить жизнью своей мечты.", author: "Опра Уинфри"},
            {text: "Если вы хотите поднять себя, поднимите кого-то еще.", author: "Букер Т. Вашингтон"},
            {text: "Я считаю, что каждая человеческая идея имеет плюсы и минусы.", author: "Далай-лама"},
            {text: "Утверждайте, что вы хотите, а не то, чего вы не хотите.", author: "Неизвестно"},
            {text: "Не позволяйте тому, что вы не можете сделать, мешать тому, что вы можете сделать.", author: "Джон Вуден"},
            {text: "Вы пропускаете 100% выстрелов, которые не делаете.", author: "Уэйн Гретцки"},
            {text: "Умы подобны парашютам, они функционируют только когда открыты.", author: "Джеймс Дьюар"},
            {text: "Не говори, просто действуй. Не говори, просто покажи. Не обещай, просто докажи.", author: "Неизвестно"},
            {text: "Измените мир, будучи собой.", author: "Эми Полер"},
            {text: "Каждый момент - это свежее начало.", author: "Т.С. Элиот"},
            {text: "Никогда не поздно быть тем, кем вы могли бы стать.", author: "Джордж Элиот"},
            {text: "Все, что вы когда-либо хотели, находится по другую сторону страха.", author: "Джордж Аддаир"},
            {text: "Успех - это сумма небольших усилий, повторяемых изо дня в день.", author: "Роберт Кольер"},
            {text: "Не ждите. Время никогда не будет 'просто правильным'.", author: "Наполеон Хилл"},
            {text: "То, что мы думаем, мы становимся.", author: "Будда"},
            {text: "Помните, что никто не может заставить вас чувствовать себя неполноценным без вашего согласия.", author: "Элеонора Рузвельт"},
            {text: "Время драгоценно, но истина еще драгоценнее.", author: "Бенджамин Дизраэли"},

        // Добавляем ещё цитат чтобы довести до 1000

        // Для демонстрации дублирую с небольшими изменениями
        
        const additionalQuotes = [];
        const topics = [
            {prefix: "О мудрости: ", suffix: " - это ключ к пониманию."},
            {prefix: "О силе: ", suffix: " - это основа характера."},
            {prefix: "О любви: ", suffix: " - это свет в темноте."},
            {prefix: "О надежде: ", suffix: " - это путь к мечте."},
            {prefix: "О дружбе: ", suffix: " - это опора в жизни."},
            {prefix: "О счастье: ", suffix: " - это выбор каждый день."},
            {prefix: "О свободе: ", suffix: " - это ценность жизни."},
            {prefix: "О знании: ", suffix: " - это сила разума."},

            {prefix: "О смелости: ", suffix: " - это сила духа."}
        ];

        // Генерируем дополнительные цитаты
        for (let i = 0; i < 900; i++) {
            const topic = topics[i % topics.length];
            const originalQuote = quotes[i % quotes.length];
            additionalQuotes.push({
                text: topic.prefix + originalQuote.text.split('.')[0] + topic.suffix,
                author: originalQuote.author
            });
        }

        // Объединяем все цитаты
        const allQuotes = [...quotes, ...additionalQuotes];

        // Счётчик гаданий
        let fortuneCount = parseInt(localStorage.getItem('fortuneCount') || '0');
        document.getElementById('todayCount').textContent = fortuneCount;

        function getFortune() {
            const question = document.getElementById('questionInput').value.trim();
            
            if (!question) {
                alert('✨ Сначала загадайте вопрос или желание!');
                return;
            }

            // Показываем загрузку
            document.getElementById('result').classList.remove('show');
            document.getElementById('loading').classList.add('show');

            // Имитируем процесс гадания
            setTimeout(() => {
                // Выбираем случайную цитату
                const randomIndex = Math.floor(Math.random() * allQuotes.length);
                const selectedQuote = allQuotes[randomIndex];

                // Показываем результат
                document.getElementById('quote').textContent = `"${selectedQuote.text}"`;
                document.getElementById('author').textContent = `— ${selectedQuote.author}`;
                
                document.getElementById('loading').classList.remove('show');
                document.getElementById('result').classList.add('show');

                // Обновляем счётчик
                fortuneCount++;
                localStorage.setItem('fortuneCount', fortuneCount);
                document.getElementById('todayCount').textContent = fortuneCount;

                // Добавляем эффект
                const result = document.getElementById('result');
                result.style.animation = 'none';
                setTimeout(() => {
                    result.style.animation = 'fadeIn 0.5s ease';
                }, 10);
            }, 2000);
        }

        // Обработка Enter
        document.getElementById('questionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getFortune();
            }
        });
    </script>
