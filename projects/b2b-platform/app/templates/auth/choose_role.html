{% extends "base.html" %}
{% block title %}{{ t('auth.choose_role_title') }}{% endblock %}

{% block content %}
<section class="wrap auth-page">
  <div class="auth-card">
    <h1>{{ t('auth.who_are_you_title') }}</h1>
    <p>{{ t('auth.google_no_role_hint') }}</p>
    <form method="post" action="{{ url_for('auth.choose_role') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <fieldset class="role-fieldset">
        <label><input type="radio" name="role" value="customer" required> {{ t('auth.role_customer') }}</label>
        <label><input type="radio" name="role" value="executor"> {{ t('auth.role_executor') }}</label>
        <label><input type="radio" name="role" value="constructor"> {{ t('auth.role_constructor') }}</label>
      </fieldset>
      <button type="submit" class="btn btn--primary btn--block">{{ t('common.continue') }}</button>
    </form>
  </div>
</section>
{% endblock %}
