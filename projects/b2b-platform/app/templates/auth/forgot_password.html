{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<section class="wrap auth-page">
  <div class="auth-card">
    <h1>Забыли пароль?</h1>
    <p>Укажите email, с которым регистрировались — пришлём ссылку для сброса пароля.</p>
    <form method="post" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>{{ t('auth.email') }}
        <input type="email" name="email" required autofocus>
      </label>
      <button type="submit" class="btn btn--primary btn--block">Отправить ссылку</button>
    </form>
    <p class="auth-card__switch"><a href="{{ url_for('auth.login') }}">← Вернуться ко входу</a></p>
  </div>
</section>
{% endblock %}
