{% extends "base.html" %}
{% block title %}{{ t('auth.forgot_password_page_title') }}{% endblock %}

{% block content %}
<section class="wrap auth-page">
  <div class="auth-card">
    <h1>{{ t('auth.forgot_password_title') }}</h1>
    <p>{{ t('auth.forgot_password_hint') }}</p>
    <form method="post" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>{{ t('auth.email') }}
        <input type="email" name="email" required autofocus>
      </label>
      <button type="submit" class="btn btn--primary btn--block">{{ t('auth.send_link') }}</button>
    </form>
    <p class="auth-card__switch"><a href="{{ url_for('auth.login') }}">{{ t('auth.back_to_login') }}</a></p>
  </div>
</section>
{% endblock %}
