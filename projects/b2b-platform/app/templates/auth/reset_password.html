{% extends "base.html" %}
{% block title %}{{ t('auth.reset_password_page_title') }}{% endblock %}

{% block content %}
<section class="wrap auth-page">
  <div class="auth-card">
    <h1>{{ t('auth.reset_password_title') }}</h1>
    <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>{{ t('auth.new_password') }}
        <input type="password" name="password" required minlength="8" autofocus>
      </label>
      <label>{{ t('auth.password2') }}
        <input type="password" name="password2" required minlength="8">
      </label>
      <button type="submit" class="btn btn--primary btn--block">{{ t('auth.save_password') }}</button>
    </form>
  </div>
</section>
{% endblock %}
