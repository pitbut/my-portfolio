{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}

{% block content %}
<section class="wrap auth-page">
  <div class="auth-card">
    <h1>Задайте новый пароль</h1>
    <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Новый пароль
        <input type="password" name="password" required minlength="8" autofocus>
      </label>
      <label>Повторите пароль
        <input type="password" name="password2" required minlength="8">
      </label>
      <button type="submit" class="btn btn--primary btn--block">Сохранить пароль</button>
    </form>
  </div>
</section>
{% endblock %}
