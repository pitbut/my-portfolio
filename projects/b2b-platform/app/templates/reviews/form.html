{% extends "base.html" %}
{% block title %}{{ t('review.leave_title') }}{% endblock %}

{% block content %}
<section class="wrap auth-page">
  <div class="auth-card">
    <h1>{{ t('review.about_order', title=order.title) }}</h1>
    <form method="post" action="{{ url_for('reviews.leave_review', order_id=order.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>{{ t('review.rating_field') }}
        <select name="rating" required>
          <option value="">{{ t('profile.select_placeholder') }}</option>
          {% for i in range(5, 0, -1) %}
            <option value="{{ i }}" {{ 'selected' if existing and existing.rating == i }}>{{ i }}</option>
          {% endfor %}
        </select>
      </label>
      <label>{{ t('review.comment_field') }}
        <textarea name="comment" rows="4">{{ existing.comment or '' if existing }}</textarea>
      </label>
      <button type="submit" class="btn btn--primary btn--block">{{ t('review.update') if existing else t('review.submit') }}</button>
    </form>
    {% if existing and not existing.is_published %}
    <p class="empty-hint">{{ t('review.pending_publish') }}</p>
    {% endif %}
  </div>
</section>
{% endblock %}
