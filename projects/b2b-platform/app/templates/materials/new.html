{% extends "base.html" %}
{% block title %}Новое объявление о материале{% endblock %}

{% block content %}
<section class="wrap profile-page">
  <h1>Новое объявление: материал/сырьё</h1>
  <form method="post" action="{{ url_for('materials_market.new_listing') }}" enctype="multipart/form-data" class="profile-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <fieldset class="role-fieldset">
      <legend>Тип объявления *</legend>
      <label><input type="radio" name="listing_intent" value="sell" required> Продаю</label>
      <label><input type="radio" name="listing_intent" value="buy"> Ищу купить</label>
    </fieldset>

    <div class="form-row">
      <label>Материал *
        <select name="material_id" required>
          <option value="">— выберите —</option>
          {% for m in materials %}<option value="{{ m.id }}">{{ m.name_ru }}</option>{% endfor %}
        </select>
      </label>
      <label>Вид/форма
        <select name="form_id">
          <option value="">— не важно —</option>
          {% for f in forms %}<option value="{{ f.id }}">{{ f.name_ru }}</option>{% endfor %}
        </select>
      </label>
    </div>

    <label>Название *
      <input type="text" name="title" placeholder="напр. Лист нержавейки AISI 304, 2 мм" required>
    </label>
    <label>Описание *
      <textarea name="description" rows="4" required></textarea>
    </label>

    <div class="form-row">
      <label>Количество <input type="number" name="quantity" min="0" step="0.01"></label>
      <label>Единица
        <select name="unit">
          <option value="kg">кг</option>
          <option value="t">тонны</option>
          <option value="m">метры</option>
          <option value="m2">м²</option>
          <option value="pcs">шт</option>
        </select>
      </label>
    </div>

    <div class="form-row">
      <label>Цена <input type="number" name="price" min="0"></label>
      <label>Валюта
        <select name="currency"><option value="UZS">UZS</option><option value="USD">USD</option></select>
      </label>
    </div>
    <label class="checkbox-label"><input type="checkbox" name="price_negotiable" value="1"> Торг уместен</label>

    <label>Регион *
      <select name="region_id" required>
        <option value="">— выберите —</option>
        {% for r in regions %}<option value="{{ r.id }}">{{ r.name_ru }}</option>{% endfor %}
      </select>
    </label>

    <label>Фото (можно несколько) <input type="file" name="photos" accept="image/*" multiple></label>

    <button type="submit" class="btn btn--primary">Опубликовать</button>
  </form>
</section>
{% endblock %}
