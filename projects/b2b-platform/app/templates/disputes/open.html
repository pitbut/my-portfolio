{% extends "base.html" %}
{% block title %}{{ t('dispute.open_title') }}{% endblock %}

{% block content %}
<section class="wrap auth-page">
  <div class="auth-card">
    <h1>{{ t('dispute.about_order', title=order.title) }}</h1>
    <p class="profile-page__hint">{{ t('dispute.describe_hint') }}</p>
    <form method="post" action="{{ url_for('disputes.open_dispute', order_id=order.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>{{ t('dispute.reason_field') }}
        <select name="reason_category" required>
          <option value="">{{ t('profile.select_placeholder') }}</option>
          <option value="defect">{{ t('dispute.reason_defect') }}</option>
          <option value="delay">{{ t('dispute.reason_delay') }}</option>
          <option value="quality">{{ t('dispute.reason_quality') }}</option>
          <option value="price_dispute">{{ t('dispute.reason_price_dispute') }}</option>
          <option value="other">{{ t('dispute.reason_other') }}</option>
        </select>
      </label>
      <label>{{ t('dispute.describe_situation') }}
        <textarea name="description" rows="5" required></textarea>
      </label>
      <button type="submit" class="btn btn--primary btn--block">{{ t('dispute.open_title') }}</button>
    </form>
  </div>
</section>
{% endblock %}
